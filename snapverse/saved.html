<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.tailwindcss.com; font-src 'self' https://fonts.gstatic.com https://fonts.googleapis.com; img-src 'self' data: https:; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://*.gstatic.com https://api.imgbb.com;">
  <title>SnapVerse • Saved</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="murray.png" type="image/png" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#1a1a2e',
            secondary: '#16213e',
            accent: '#e94560',
            accentHover: '#d63d55',
            accentLight: '#f06b82',
            light: '#f8f9fa',
            dark: {
              bg: '#0f172a',
              surface: '#1e293b',
              border: '#334155',
              text: '#f1f5f9',
              muted: '#94a3b8',
            },
            gradient: {
              from: '#e94560',
              to: '#8b5cf6',
            },
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          fontSize: {
            'xs': ['0.75rem', { lineHeight: '1rem' }],
            'sm': ['0.875rem', { lineHeight: '1.25rem' }],
            'base': ['1rem', { lineHeight: '1.5rem' }],
            'lg': ['1.125rem', { lineHeight: '1.75rem' }],
            'xl': ['1.25rem', { lineHeight: '1.75rem' }],
            '2xl': ['1.5rem', { lineHeight: '2rem' }],
            '3xl': ['1.875rem', { lineHeight: '2.25rem' }],
          },
          letterSpacing: {
            'tight': '-0.025em',
            'normal': '0',
            'wide': '0.025em',
          },
          animation: {
            'fade-in': 'fadeIn 0.3s ease-in-out',
            'slide-up': 'slideUp 0.3s ease-out',
            'slide-down': 'slideDown 0.3s ease-out',
            'scale-in': 'scaleIn 0.2s ease-out',
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'gradient-x': 'gradientX 3s ease infinite',
            'float': 'float 3s ease-in-out infinite',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { transform: 'translateY(10px)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' },
            },
            slideDown: {
              '0%': { transform: 'translateY(-10px)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' },
            },
            scaleIn: {
              '0%': { transform: 'scale(0.95)', opacity: '0' },
              '100%': { transform: 'scale(1)', opacity: '1' },
            },
            gradientX: {
              '0%, 100%': {
                'background-size': '200% 200%',
                'background-position': 'left center'
              },
              '50%': {
                'background-size': '200% 200%',
                'background-position': 'right center'
              },
            },
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-5px)' },
            },
          },
          backgroundImage: {
            'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
            'gradient-conic': 'conic-gradient(from 180deg at 50% 50%, var(--tw-gradient-stops))',
          },
          boxShadow: {
            'soft': '0 2px 8px rgba(0, 0, 0, 0.08)',
            'medium': '0 4px 16px rgba(0, 0, 0, 0.12)',
            'strong': '0 8px 32px rgba(0, 0, 0, 0.16)',
            'glow': '0 0 20px rgba(233, 69, 96, 0.3)',
            'glow-purple': '0 0 20px rgba(139, 92, 246, 0.3)',
          },
        },
      },
    }
  </script>
</head>
<body class="bg-light dark:bg-dark-bg text-gray-900 dark:text-dark-text font-sans">
  <nav class="bg-white/80 dark:bg-dark-surface/80 backdrop-blur-lg border-b border-gray-200/50 dark:border-dark-border/50 sticky top-0 z-30 px-4 py-3">
    <div class="max-w-3xl mx-auto flex justify-between items-center">
      <a href="/index.html" class="font-bold text-accent hover:scale-105 transition-transform">← Feed</a>
      <h1 class="font-bold text-gray-900 dark:text-dark-text">Saved posts</h1>
      <button type="button" id="darkModeToggle" class="p-2 rounded-lg border border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-700 hover:scale-105 active:scale-95 transition-all duration-200">
        <span class="dark:hidden">🌙</span>
        <span class="hidden dark:block">☀️</span>
      </button>
    </div>
  </nav>
  <main class="max-w-3xl mx-auto p-4 space-y-4 animate-fade-in" id="savedList">
    <p class="text-center text-gray-500 dark:text-dark-muted py-12">Loading saved posts...</p>
  </main>
  <script type="module">
    import { initFirebase } from "./src/firebase-config.js";
    import { requireAuth, bootPage } from "./src/page-boot.js";
    import { getSavedPostIds } from "./src/bookmarks.js";
    import { fetchPost } from "./src/repost.js";
    import { renderPostCard } from "./src/post-card.js";
    import { initDarkMode } from "./src/ui.js";

    const firebase = initFirebase();
    const user = await requireAuth(firebase);
    if (!user) {
      window.location.replace("/login.html");
      throw new Error("auth");
    }
    bootPage(firebase);
    initDarkMode("darkModeToggle");
    window.currentFirebaseUser = user;
    window.__firebaseApp = firebase;

    const list = document.getElementById("savedList");
    const ids = await getSavedPostIds(firebase);
    list.innerHTML = "";

    if (!ids.length) {
      list.innerHTML = '<p class="text-center text-gray-500 py-12">No saved posts. Tap 🔖 Save on any post.</p>';
    } else {
      const db = firebase.__db;
      for (const id of ids) {
        const post = await fetchPost(db, id);
        if (post) list.appendChild(renderPostCard(post, db));
      }
    }
  </script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
