<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://apis.google.com https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://fonts.googleapis.com; img-src 'self' data: https:; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://*.gstatic.com https://api.imgbb.com;">
  <title>SnapVerse • Saved</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="murray.png" type="image/png" />
  <link rel="stylesheet" href="/assets/login.css">
</head>
<body class="bg-light dark:bg-dark-bg text-gray-900 dark:text-dark-text font-sans">
  <nav class="bg-white/80 dark:bg-dark-surface/80 backdrop-blur-lg border-b border-gray-200/50 dark:border-dark-border/50 sticky top-0 z-30 px-4 py-3">
    <div class="max-w-3xl mx-auto flex justify-between items-center">
      <a href="/index.html" class="font-bold text-accent hover:scale-105 transition-transform">← Feed</a>
      <h1 class="font-bold text-gray-900 dark:text-dark-text">Saved posts</h1>
      <button type="button" id="darkModeToggle" class="p-2 rounded-lg border border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-700 hover:scale-105 active:scale-95 transition-all duration-200">
        <span class="dark:hidden">🌙</span>
        <span class="hidden dark:block">☀️</span>
      </button>
    </div>
  </nav>
  <main class="max-w-3xl mx-auto p-4 space-y-4 animate-fade-in" id="savedList">
    <p class="text-center text-gray-500 dark:text-dark-muted py-12">Loading saved posts...</p>
  </main>
  <script type="module">
    import { initFirebase } from "./src/firebase-config.js";
    import { requireAuth, bootPage } from "./src/page-boot.js";
    import { getSavedPostIds } from "./src/bookmarks.js";
    import { fetchPost } from "./src/repost.js";
    import { renderPostCard } from "./src/post-card.js";
    import { initDarkMode } from "./src/ui.js";

    const firebase = initFirebase();
    const user = await requireAuth(firebase);
    if (!user) {
      window.location.replace("/login.html");
      throw new Error("auth");
    }
    bootPage(firebase);
    initDarkMode("darkModeToggle");
    window.currentFirebaseUser = user;
    window.__firebaseApp = firebase;

    const list = document.getElementById("savedList");
    const ids = await getSavedPostIds(firebase);
    list.innerHTML = "";

    if (!ids.length) {
      list.innerHTML = '<p class="text-center text-gray-500 py-12">No saved posts. Tap 🔖 Save on any post.</p>';
    } else {
      const db = firebase.__db;
      for (const id of ids) {
        const post = await fetchPost(db, id);
        if (post) list.appendChild(renderPostCard(post, db));
      }
    }
  </script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
