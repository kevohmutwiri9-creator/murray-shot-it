<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SnapVerse • Profile</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="murray.png" type="image/png" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#1a1a2e',
            secondary: '#16213e',
            accent: '#e94560',
            light: '#f8f9fa',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        },
      },
    }
  </script>
</head>

<body class="bg-light dark:bg-gray-900 text-gray-900 dark:text-gray-100 font-sans">
  <!-- Header -->
  <nav class="bg-white/90 dark:bg-gray-800/90 backdrop-blur-md border-b border-gray-200 dark:border-gray-700">
    <div class="max-w-6xl mx-auto px-3 sm:px-4 lg:px-8">
      <div class="flex items-center justify-between h-14 sm:h-16">
        <a href="/index.html" class="flex items-center space-x-2">
          <img src="murray.png" alt="SnapVerse" class="w-7 h-7 sm:w-8 sm:h-8"/>
          <span class="text-lg sm:text-xl font-bold text-transparent bg-gradient-to-r from-accent to-purple-600 bg-clip-text">SnapVerse</span>
        </a>

        <div class="flex items-center gap-2 sm:gap-3">
          <button id="darkModeToggle" class="p-2 rounded-xl border border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-700 transition">
            <svg id="moonIcon" class="h-5 w-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
            </svg>
            <svg id="sunIcon" class="h-5 w-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12 a4 4 0 11-8 0 4 4 0 018 0z"/>
            </svg>
          </button>
          <div class="hidden sm:flex sm:items-center sm:gap-3">
            <a href="/index.html" class="text-gray-700 dark:text-gray-300 hover:text-accent font-medium text-sm">Feed</a>
            <a href="settings.html" class="text-gray-700 dark:text-gray-300 hover:text-accent font-medium text-sm">Settings</a>
          </div>
          <button id="mobileMenuBtn" class="sm:hidden p-2 rounded-xl border border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-700 transition">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Mobile Menu -->
  <div id="mobileMenu" class="fixed inset-0 bg-black/50 z-50 hidden sm:hidden">
    <div class="absolute right-0 top-0 h-full w-64 bg-white dark:bg-gray-800 shadow-xl">
      <div class="p-4 border-b border-gray-200 dark:border-gray-700">
        <button id="closeMobileMenu" class="p-2 rounded-xl border border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-700 transition">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="p-4 space-y-2">
        <a href="/index.html" class="block px-4 py-3 rounded-xl text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 font-medium">Feed</a>
        <a href="settings.html" class="block px-4 py-3 rounded-xl text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 font-medium">Settings</a>
      </div>
    </div>
  </div>

  <!-- Main -->
  <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
    <!-- Profile Header -->
    <section class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden mb-8">
      <div class="h-32 bg-gradient-to-r from-accent to-purple-600"></div>
      <div class="px-6 pb-6">
        <div class="flex flex-col sm:flex-row items-start sm:items-end gap-4 -mt-12">
          <div id="profileAvatar" class="w-24 h-24 rounded-2xl bg-gradient-to-br from-primary to-secondary text-white text-3xl font-bold flex items-center justify-center border-4 border-white dark:border-gray-800 shadow-lg">
            ?
          </div>
          <div class="flex-1">
            <h1 id="profileName" class="text-2xl font-bold text-gray-900 dark:text-white">Loading...</h1>
            <p id="profileEmail" class="text-gray-500 dark:text-gray-400">Loading...</p>
            <div class="mt-2 flex gap-4 text-sm">
              <span id="followersCount" class="text-gray-600 dark:text-gray-400">0 followers</span>
              <span id="followingCount" class="text-gray-600 dark:text-gray-400">0 following</span>
            </div>
          </div>
          <div id="profileActions" class="flex gap-2 flex-wrap">
            <button id="editProfileBtn" class="px-4 py-2 rounded-xl border border-gray-200 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-700 transition">
              Edit Profile
            </button>
          </div>
        </div>
        <div class="mt-6">
          <p id="profileBio" class="text-gray-700 dark:text-gray-300">No bio yet. Click Edit Profile to add one!</p>
        </div>
      </div>
    </section>

    <!-- Edit Profile Modal -->
    <div id="editProfileModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
      <div class="bg-white dark:bg-gray-800 rounded-2xl max-w-md w-full p-6">
        <h2 class="text-xl font-bold text-gray-900 dark:text-white mb-4">Edit Profile</h2>
        <form id="editProfileForm" class="space-y-4">
          <div>
            <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Display Name</label>
            <input
              id="editName"
              type="text"
              maxlength="50"
              class="w-full rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700 px-4 py-2 text-gray-900 dark:text-white outline-none focus:ring-2 focus:ring-accent/30"
              placeholder="Your name"
            />
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Bio</label>
            <textarea
              id="editBio"
              maxlength="200"
              rows="3"
              class="w-full rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700 px-4 py-2 text-gray-900 dark:text-white outline-none focus:ring-2 focus:ring-accent/30 resize-none"
              placeholder="Tell us about yourself..."
            ></textarea>
          </div>
          <div class="flex gap-3">
            <button type="submit" class="flex-1 px-4 py-2 rounded-xl bg-accent text-white font-semibold hover:bg-accent/90 transition">
              Save
            </button>
            <button type="button" id="cancelEditBtn" class="flex-1 px-4 py-2 rounded-xl border border-gray-200 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-700 transition">
              Cancel
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- User's Posts -->
    <section>
      <div class="flex items-center justify-between mb-4">
        <h2 id="postsSectionTitle" class="text-2xl font-bold text-gray-900 dark:text-white">Posts</h2>
        <div class="text-sm text-gray-500 dark:text-gray-400" id="postCount"></div>
      </div>

      <div id="userPosts" class="space-y-4">
        <!-- Posts render here -->
      </div>

      <div id="noPosts" class="text-center text-gray-500 dark:text-gray-400 py-12 hidden">
        No posts yet. Create your first post!
      </div>
    </section>
  </main>

  <script type="module">
    import { initFirebase } from "./src/firebase-config.js";
    import { getCurrentUser } from "./src/auth.js";
    import { requireAuth, bootPage } from "./src/page-boot.js";
    import { isPostVisible } from "./src/scheduled-posts.js";
    import { showToast } from "./src/ui.js";
    import { loadProfilesCache } from "./src/profiles-cache.js";
    import { renderPostCard } from "./src/post-card.js";
    import { collection, query, orderBy, where, onSnapshot, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { isFollowing, followUser, unfollowUser, getFollowersCount, getFollowingCount } from "./src/follows.js";

    const firebase = initFirebase();
    const me = await requireAuth(firebase);
    if (!me) throw new Error("Not signed in");

    const db = firebase.__db;
    bootPage(firebase);
    window.currentFirebaseUser = me;
    window.__firebaseApp = firebase;
    await loadProfilesCache(db);

    const viewUid = new URLSearchParams(location.search).get("uid") || me.uid;
    const isOwnProfile = viewUid === me.uid;

    // Load profile
    const loadProfile = async () => {
      const profileRef = doc(db, "profiles", viewUid);
      const profileSnap = await getDoc(profileRef);

      const profile = profileSnap.exists() ? profileSnap.data() : {};
      const displayName = profile.displayName || profile.email || "User";
      document.getElementById("profileName").textContent = displayName;
      document.getElementById("profileEmail").textContent = profile.email || (isOwnProfile ? me.email : "");
      document.getElementById("profileBio").textContent = profile.bio || (isOwnProfile ? "No bio yet. Click Edit Profile to add one!" : "No bio yet.");
      document.getElementById("profileAvatar").textContent = displayName.charAt(0).toUpperCase();

      const followersCount = await getFollowersCount(db, viewUid);
      const followingCount = await getFollowingCount(db, viewUid);
      document.getElementById("followersCount").textContent = `${followersCount} followers`;
      document.getElementById("followingCount").textContent = `${followingCount} following`;

      const actions = document.getElementById("profileActions");
      actions.innerHTML = "";

      if (isOwnProfile) {
        const editBtn = document.createElement("button");
        editBtn.id = "editProfileBtn";
        editBtn.className = "px-4 py-2 rounded-xl border border-gray-200 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-700 transition";
        editBtn.textContent = "Edit Profile";
        actions.appendChild(editBtn);
        editBtn.addEventListener("click", openEditModal);
      } else {
        let following = await isFollowing(db, me.uid, viewUid);
        const followBtn = document.createElement("button");
        const styleFollowBtn = () => {
          followBtn.className = `px-4 py-2 rounded-xl font-semibold transition ${following ? "border border-gray-200 dark:border-gray-600" : "bg-accent text-white"}`;
          followBtn.textContent = following ? "Following" : "Follow";
        };
        styleFollowBtn();
        followBtn.addEventListener("click", async () => {
          if (following) {
            await unfollowUser(db, me.uid, viewUid);
            following = false;
            showToast("Unfollowed.", "info");
          } else {
            await followUser(db, me.uid, viewUid, firebase);
            following = true;
            showToast("Following!", "success");
          }
          styleFollowBtn();
        });
        const msgBtn = document.createElement("a");
        msgBtn.href = `messages.html?uid=${viewUid}`;
        msgBtn.className = "px-4 py-2 rounded-xl border border-gray-200 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-700 transition font-semibold";
        msgBtn.textContent = "Message";
        actions.append(followBtn, msgBtn);
      }

      document.getElementById("postsSectionTitle").textContent = isOwnProfile ? "My Posts" : "Posts";
    };

    // Load user's posts
    const loadUserPosts = () => {
      const postsCol = collection(db, "posts");
      const q = query(postsCol, where("authorUid", "==", viewUid), orderBy("createdAt", "desc"));

      onSnapshot(q, (snapshot) => {
        const posts = [];
        snapshot.forEach((docSnap) => {
          const post = { id: docSnap.id, ...docSnap.data() };
          if (isPostVisible(post)) posts.push(post);
        });

        const container = document.getElementById("userPosts");
        const emptyEl = document.getElementById("noPosts");
        const countEl = document.getElementById("postCount");

        container.innerHTML = "";
        emptyEl.classList.toggle("hidden", posts.length > 0);
        countEl.textContent = `${posts.length} post${posts.length === 1 ? "" : "s"}`;

        posts.forEach((post) => {
          container.appendChild(renderPostCard(post, db));
        });
      });
    };

    // Edit profile modal
    const modal = document.getElementById("editProfileModal");
    const cancelBtn = document.getElementById("cancelEditBtn");
    const editForm = document.getElementById("editProfileForm");

    async function openEditModal() {
      const profileRef = doc(db, "profiles", me.uid);
      const profileSnap = await getDoc(profileRef);
      if (profileSnap.exists()) {
        const profile = profileSnap.data();
        document.getElementById("editName").value = profile.displayName || "";
        document.getElementById("editBio").value = profile.bio || "";
      }
      modal.classList.remove("hidden");
    }

    cancelBtn.addEventListener("click", () => {
      modal.classList.add("hidden");
    });

    editForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const displayName = document.getElementById("editName").value.trim();
      const bio = document.getElementById("editBio").value.trim();

      const profileRef = doc(db, "profiles", me.uid);
      await setDoc(profileRef, {
        displayName,
        bio,
        email: me.email,
        uid: me.uid,
        updatedAt: new Date()
      }, { merge: true });

      modal.classList.add("hidden");
      await loadProfile();
    });

    // Initialize
    await loadProfile();
    loadUserPosts();
  </script>
</body>
</html>
