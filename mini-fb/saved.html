<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SnapVerse • Saved</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="murray.png" type="image/png" />
  <script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { accent: '#e94560' } } } } }</script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 font-sans">
  <nav class="bg-white dark:bg-gray-800 border-b px-4 py-3">
    <div class="max-w-3xl mx-auto flex justify-between items-center">
      <a href="/index.html" class="font-bold text-accent">← Feed</a>
      <h1 class="font-bold">Saved posts</h1>
      <span class="w-12"></span>
    </div>
  </nav>
  <main class="max-w-3xl mx-auto p-4 space-y-4" id="savedList">
    <p class="text-center text-gray-500 py-12">Loading saved posts...</p>
  </main>
  <script type="module">
    import { initFirebase } from "./src/firebase-config.js";
    import { requireAuth, bootPage } from "./src/page-boot.js";
    import { getSavedPostIds } from "./src/bookmarks.js";
    import { fetchPost } from "./src/repost.js";
    import { renderPostCard } from "./src/post-card.js";

    const firebase = initFirebase();
    const user = await requireAuth(firebase);
    if (!user) throw new Error("auth");
    bootPage(firebase);
    window.currentFirebaseUser = user;
    window.__firebaseApp = firebase;

    const list = document.getElementById("savedList");
    const ids = await getSavedPostIds(firebase);
    list.innerHTML = "";

    if (!ids.length) {
      list.innerHTML = '<p class="text-center text-gray-500 py-12">No saved posts. Tap 🔖 Save on any post.</p>';
    } else {
      const db = firebase.__db;
      for (const id of ids) {
        const post = await fetchPost(db, id);
        if (post) list.appendChild(renderPostCard(post, db));
      }
    }
  </script>
</body>
</html>
