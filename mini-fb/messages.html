<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SnapVerse • Messages</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="murray.png" type="image/png" />
  <script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { accent: '#e94560', primary: '#1a1a2e' } } } } }</script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 font-sans min-h-screen">
  <nav class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 px-4 py-3">
    <div class="max-w-5xl mx-auto flex items-center justify-between">
      <a href="/index.html" class="font-bold text-accent">← Feed</a>
      <h1 class="font-bold">Messages</h1>
      <span class="w-12"></span>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto p-4 grid lg:grid-cols-[280px_1fr] gap-4 min-h-[calc(100vh-4rem)]">
    <aside class="bg-white dark:bg-gray-800 rounded-2xl border border-gray-200 dark:border-gray-700 overflow-hidden">
      <div class="p-3 border-b border-gray-200 dark:border-gray-700 font-semibold text-sm">Conversations</div>
      <div id="convList" class="max-h-[70vh] overflow-y-auto divide-y divide-gray-100 dark:divide-gray-700">
        <p class="p-4 text-sm text-gray-500">Loading...</p>
      </div>
    </aside>

    <section class="bg-white dark:bg-gray-800 rounded-2xl border border-gray-200 dark:border-gray-700 flex flex-col min-h-[400px]">
      <div id="chatHeader" class="p-4 border-b border-gray-200 dark:border-gray-700 font-semibold">Select a conversation</div>
      <div id="chatMessages" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
      <form id="chatForm" class="p-4 border-t border-gray-200 dark:border-gray-700 flex gap-2 hidden">
        <input id="chatInput" type="text" maxlength="500" required placeholder="Type a message..." class="flex-1 rounded-xl border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 px-4 py-2 text-sm" />
        <button type="submit" class="px-4 py-2 rounded-xl bg-accent text-white font-semibold text-sm">Send</button>
      </form>
    </section>
  </main>

  <script type="module">
    import { initFirebase } from "./src/firebase-config.js";
    import { requireAuth, bootPage } from "./src/page-boot.js";
    import { getCurrentUser } from "./src/auth.js";
    import { listenMyConversations, listenMessages, sendMessage, getOrCreateConversation, conversationId } from "./src/messages.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { showToast } from "./src/ui.js";

    const firebase = initFirebase();
    const user = await requireAuth(firebase);
    if (!user) throw new Error("auth");
    bootPage(firebase);

    const db = firebase.__db;
    const convList = document.getElementById("convList");
    const chatMessages = document.getElementById("chatMessages");
    const chatHeader = document.getElementById("chatHeader");
    const chatForm = document.getElementById("chatForm");
    const chatInput = document.getElementById("chatInput");

    let activeOtherUid = new URLSearchParams(location.search).get("uid");
    let msgUnsub = null;

    async function otherParticipantName(otherUid) {
      const snap = await getDoc(doc(db, "profiles", otherUid));
      if (snap.exists()) return snap.data().displayName || snap.data().email;
      return "User";
    }

    function openChat(otherUid) {
      activeOtherUid = otherUid;
      const convId = conversationId(user.uid, otherUid);
      chatForm.classList.remove("hidden");
      if (msgUnsub) msgUnsub();

      otherParticipantName(otherUid).then((name) => {
        chatHeader.textContent = name;
      });

      msgUnsub = listenMessages(db, convId, (snap) => {
        chatMessages.innerHTML = "";
        snap.forEach((d) => {
          const m = d.data();
          const mine = m.senderUid === user.uid;
          const bubble = document.createElement("div");
          bubble.className = mine ? "flex justify-end" : "flex justify-start";
          bubble.innerHTML = `<div class="max-w-[80%] rounded-2xl px-4 py-2 text-sm ${mine ? "bg-accent text-white" : "bg-gray-100 dark:bg-gray-700"}">${m.text}</div>`;
          chatMessages.appendChild(bubble);
        });
        chatMessages.scrollTop = chatMessages.scrollHeight;
      });
    }

    listenMyConversations(db, async (snap) => {
      convList.innerHTML = "";
      if (snap.empty) {
        convList.innerHTML = '<p class="p-4 text-sm text-gray-500">No messages yet. Message someone from their profile.</p>';
        return;
      }

      for (const d of snap.docs) {
        const data = d.data();
        const other = data.participants.find((p) => p !== user.uid);
        const name = await otherParticipantName(other);
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "w-full text-left p-3 hover:bg-gray-50 dark:hover:bg-gray-700 transition";
        btn.innerHTML = `<p class="font-semibold text-sm">${name}</p><p class="text-xs text-gray-500 truncate">${data.lastMessage || ""}</p>`;
        btn.addEventListener("click", () => openChat(other));
        convList.appendChild(btn);
      }

      if (activeOtherUid) {
        await getOrCreateConversation(db, activeOtherUid);
        openChat(activeOtherUid);
      }
    });

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!activeOtherUid) return;
      try {
        await sendMessage(firebase, activeOtherUid, chatInput.value);
        chatInput.value = "";
      } catch (err) {
        showToast(err.message, "error");
      }
    });
  </script>
</body>
</html>
