<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SnapVerse • Messages</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="murray.png" type="image/png" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { accent: '#e94560', primary: '#1a1a2e' } } } }
    };
  </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 font-sans min-h-screen">
  <nav class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 px-4 py-3">
    <div class="max-w-5xl mx-auto flex items-center justify-between gap-2">
      <a href="/index.html" class="font-bold text-accent shrink-0">← Feed</a>
      <h1 class="font-bold">Messages</h1>
      <button type="button" id="darkModeToggle" class="p-2 rounded-lg border border-gray-200 dark:border-gray-600 text-sm">🌙</button>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto p-4 grid lg:grid-cols-[300px_1fr] gap-4 min-h-[calc(100vh-4rem)]">
    <aside class="bg-white dark:bg-gray-800 rounded-2xl border border-gray-200 dark:border-gray-700 overflow-hidden flex flex-col max-h-[calc(100vh-6rem)]">
      <div class="p-3 border-b border-gray-200 dark:border-gray-700 space-y-2">
        <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide">New message</label>
        <input id="userSearch" type="search" placeholder="Search people..." class="w-full rounded-xl border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 px-3 py-2 text-sm" />
        <div id="searchResults" class="max-h-32 overflow-y-auto hidden"></div>
        <button type="button" id="newGroupBtn" class="w-full text-sm font-semibold py-2 rounded-xl border border-gray-200 dark:border-gray-600 hover:bg-gray-50 dark:hover:bg-gray-700">+ New group chat</button>
      </div>
      <div class="p-3 border-b border-gray-200 dark:border-gray-700 font-semibold text-sm">Conversations</div>
      <div id="convList" class="flex-1 overflow-y-auto divide-y divide-gray-100 dark:divide-gray-700">
        <p class="p-4 text-sm text-gray-500">Loading...</p>
      </div>
    </aside>

    <section class="bg-white dark:bg-gray-800 rounded-2xl border border-gray-200 dark:border-gray-700 flex flex-col min-h-[400px] max-h-[calc(100vh-6rem)]">
      <div id="chatHeader" class="p-4 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between gap-2">
        <div class="min-w-0">
          <span id="chatHeaderTitle" class="font-semibold">Select a conversation</span>
          <p id="chatHeaderStatus" class="text-xs text-gray-500 hidden"></p>
        </div>
        <div id="chatHeaderActions" class="shrink-0"></div>
      </div>
      <div id="chatMessages" class="flex-1 overflow-y-auto p-4 space-y-3 min-h-[200px]">
        <p class="text-sm text-gray-500 text-center py-8">Pick someone from the list or search to start chatting.</p>
      </div>
      <form id="chatForm" class="p-4 border-t border-gray-200 dark:border-gray-700 flex flex-wrap gap-2 hidden">
        <input id="chatImage" type="file" accept="image/*" class="hidden" />
        <button type="button" id="attachImageBtn" class="px-3 py-2 rounded-xl border border-gray-200 dark:border-gray-600 text-sm shrink-0">📷</button>
        <input id="chatInput" type="text" maxlength="500" placeholder="Type a message..." class="flex-1 min-w-[120px] rounded-xl border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 px-4 py-2 text-sm text-gray-900 dark:text-white" />
        <button type="submit" class="px-4 py-2 rounded-xl bg-accent text-white font-semibold text-sm shrink-0">Send</button>
      </form>
    </section>
  </main>

  <script type="module">
    import { initFirebase } from "./src/firebase-config.js";
    import { requireAuth, bootPage } from "./src/page-boot.js";
    import {
      listenMyConversations,
      listenMessages,
      sendMessage,
      getOrCreateConversation,
      conversationId,
      searchProfilesForMessaging,
      getProfileDisplayName,
      escapeHtml,
      markConversationRead,
      markMessagesDelivered,
      setTyping,
      createGroupConversation,
      isGroupConversationId,
    } from "./src/messages.js";
    import {
      subscribePresence,
      messageStatusMeta,
      presenceDotClass,
      isTypingRecent,
    } from "./src/presence.js";
    import { profileUrl } from "./src/profiles-cache.js";
    import { loadProfilesCache, uidForHandle } from "./src/profiles-cache.js";
    import { initDarkMode, showToast } from "./src/ui.js";
    import { uploadMedia } from "./src/image-upload.js";
    import { doc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebase = initFirebase();
    const user = await requireAuth(firebase);
    if (!user) throw new Error("auth");

    initDarkMode("darkModeToggle");
    bootPage(firebase);

    const db = firebase.__db;
    await loadProfilesCache(db);

    const params = new URLSearchParams(location.search);
    const urlUid = params.get("uid");
    const urlConv = params.get("conv");
    const sharePost = params.get("sharePost");

    const convList = document.getElementById("convList");
    const chatMessages = document.getElementById("chatMessages");
    const chatHeader = document.getElementById("chatHeader");
    const chatForm = document.getElementById("chatForm");
    const chatInput = document.getElementById("chatInput");
    const chatImage = document.getElementById("chatImage");
    const userSearch = document.getElementById("userSearch");

    let activeTarget = urlConv || urlUid || null;
    let activeConvId = null;
    let activeOtherUid = null;
    let msgUnsub = null;
    let convUnsub = null;
    let typingTimer = null;
    let didInitialOpen = false;
    const nameCache = new Map();
    const presenceByUid = new Map();

    const chatHeaderTitle = document.getElementById("chatHeaderTitle");
    const chatHeaderStatus = document.getElementById("chatHeaderStatus");
    const chatHeaderActions = document.getElementById("chatHeaderActions");

    async function displayName(uid) {
      if (nameCache.has(uid)) return nameCache.get(uid);
      const name = await getProfileDisplayName(db, uid);
      nameCache.set(uid, name);
      return name;
    }

    function setActiveConv(convId, otherUid) {
      convList.querySelectorAll("[data-conv-id]").forEach((btn) => {
        const active = btn.dataset.convId === convId;
        btn.classList.toggle("bg-accent/10", active);
        btn.classList.toggle("border-l-4", active);
        btn.classList.toggle("border-accent", active);
      });
    }

    function renderMessageStatus(m) {
      const status = messageStatusMeta(m);
      const meta = document.createElement("span");
      meta.className = `text-[10px] mt-0.5 flex items-center gap-1 ${status.className}`;
      meta.title = status.label;
      meta.innerHTML = `<span class="tracking-tighter font-semibold">${status.ticks}</span><span>${status.label}</span>`;
      return meta;
    }

    function renderMessages(snap) {
      chatMessages.innerHTML = "";
      if (snap.empty) {
        chatMessages.innerHTML = '<p class="text-sm text-gray-500 text-center py-8">No messages yet. Say hello!</p>';
        return;
      }
      snap.forEach((d) => {
        const m = d.data();
        const mine = m.senderUid === user.uid;
        const wrap = document.createElement("div");
        wrap.className = mine ? "flex flex-col items-end" : "flex flex-col items-start";
        const inner = document.createElement("div");
        inner.className = `max-w-[85%] rounded-2xl px-4 py-2 text-sm break-words space-y-2 ${
          mine ? "bg-accent text-white" : "bg-gray-100 dark:bg-gray-700 text-gray-900 dark:text-white"
        }`;
        if (m.text) {
          const p = document.createElement("p");
          p.textContent = m.text;
          inner.appendChild(p);
        }
        if (m.imageUrl) {
          const img = document.createElement("img");
          img.src = m.imageUrl;
          img.alt = "Image";
          img.className = "max-w-full rounded-xl max-h-48 object-cover";
          inner.appendChild(img);
        }
        if (m.postLink) {
          const a = document.createElement("a");
          a.href = m.postLink;
          a.target = "_blank";
          a.rel = "noopener";
          a.className = mine ? "underline text-white/90" : "text-accent underline";
          a.textContent = "View shared post";
          inner.appendChild(a);
        }
        wrap.appendChild(inner);
        if (mine) wrap.appendChild(renderMessageStatus(m));
        chatMessages.appendChild(wrap);
      });
      chatMessages.scrollTop = chatMessages.scrollHeight;
      if (activeConvId) markMessagesDelivered(db, activeConvId).catch(() => {});
    }

    function updateChatPresenceLabel(state, typing = false) {
      if (!chatHeaderStatus) return;
      if (typing) {
        chatHeaderStatus.textContent = "typing...";
        chatHeaderStatus.classList.remove("hidden", "text-emerald-500");
        chatHeaderStatus.classList.add("text-accent");
        return;
      }
      if (!state) {
        chatHeaderStatus.classList.add("hidden");
        return;
      }
      chatHeaderStatus.classList.remove("hidden", "text-accent");
      chatHeaderStatus.classList.toggle("text-emerald-500", state.online);
      chatHeaderStatus.classList.toggle("text-gray-500", !state.online);
      chatHeaderStatus.textContent = state.label;
    }

    function ensurePresenceWatch(uid) {
      if (!uid) return;
      if (presenceByUid.has(uid)) return;
      presenceByUid.set(uid, { online: false, label: "Offline" });
      subscribePresence(db, uid, (state) => {
        presenceByUid.set(uid, state);
        document.querySelectorAll(`[data-presence-uid="${uid}"]`).forEach((dot) => {
          dot.className = `inline-block w-2 h-2 rounded-full shrink-0 ${presenceDotClass(state.online)}`;
          dot.title = state.label;
        });
        if (uid === activeOtherUid) updateChatPresenceLabel(state, false);
      });
    }

    async function openConversation(convId, otherUid = null) {
      if (!convId) return;
      if (activeConvId === convId && msgUnsub) {
        setActiveConv(convId, otherUid);
        return;
      }

      activeConvId = convId;
      activeOtherUid = otherUid;
      activeTarget = isGroupConversationId(convId) ? convId : otherUid || activeTarget;

      history.replaceState(
        null,
        "",
        isGroupConversationId(convId) ? `?conv=${encodeURIComponent(convId)}` : `?uid=${encodeURIComponent(otherUid || activeTarget)}`
      );

      if (msgUnsub) {
        msgUnsub();
        msgUnsub = null;
      }
      if (convUnsub) {
        convUnsub();
        convUnsub = null;
      }

      chatForm.classList.remove("hidden");
      setActiveConv(convId, otherUid);
      await markConversationRead(db, convId);
      await markMessagesDelivered(db, convId);

      const convSnap = await getDoc(doc(db, "conversations", convId));
      const convData = convSnap.data() || {};
      const isGroup = convData.type === "group" || isGroupConversationId(convId);

      chatHeaderActions.innerHTML = "";
      chatHeaderStatus.classList.add("hidden");

      if (isGroup) {
        chatHeaderTitle.textContent = convData.title || "Group chat";
        chatHeaderStatus.textContent = `${(convData.participants || []).length} members`;
        chatHeaderStatus.classList.remove("hidden");
        chatHeaderStatus.classList.remove("text-emerald-500", "text-accent");
        chatHeaderStatus.classList.add("text-gray-500");
      } else {
        const uid = otherUid || (convData.participants || []).find((p) => p !== user.uid);
        activeOtherUid = uid;
        const name = await displayName(uid);
        chatHeaderTitle.innerHTML = `<a href="${profileUrl(uid)}" class="hover:text-accent transition">${escapeHtml(name)}</a>`;
        const profileLink = document.createElement("a");
        profileLink.href = profileUrl(uid);
        profileLink.className = "text-xs text-accent font-medium";
        profileLink.textContent = "View profile";
        chatHeaderActions.appendChild(profileLink);

        ensurePresenceWatch(uid);
        updateChatPresenceLabel(presenceByUid.get(uid));
      }

      convUnsub = onSnapshot(doc(db, "conversations", convId), (snap) => {
        const data = snap.data() || {};
        if (isGroup || !activeOtherUid) return;
        const typingAt = data.typing?.[activeOtherUid];
        if (isTypingRecent(typingAt)) {
          updateChatPresenceLabel(presenceByUid.get(activeOtherUid), true);
        } else {
          updateChatPresenceLabel(presenceByUid.get(activeOtherUid), false);
        }
      });

      if (sharePost && !chatInput.value) {
        chatInput.value = `Check this out: ${decodeURIComponent(sharePost)}`;
      }

      msgUnsub = listenMessages(db, convId, renderMessages, (err) => {
        chatMessages.innerHTML = `<p class="text-sm text-rose-500 p-4">${escapeHtml(err.message || "Could not load messages.")}</p>`;
      });
      chatInput.focus();
    }

    async function openDm(otherUid) {
      const convId = await getOrCreateConversation(db, otherUid);
      await openConversation(convId, otherUid);
    }

    function maybeOpenFromUrl() {
      if (didInitialOpen) return;
      didInitialOpen = true;
      if (urlConv) openConversation(urlConv);
      else if (urlUid) openDm(urlUid);
    }

    function renderConversationList(snap) {
      convList.innerHTML = "";
      if (snap.empty) {
        convList.innerHTML = '<p class="p-4 text-sm text-gray-500">No conversations yet.</p>';
        maybeOpenFromUrl();
        return;
      }

      snap.docs.forEach((d) => {
        const data = d.data();
        const convId = d.id;
        const unread = data.unreadCounts?.[user.uid] || 0;
        const isGroup = data.type === "group" || isGroupConversationId(convId);

        const btn = document.createElement("button");
        btn.type = "button";
        btn.dataset.convId = convId;
        btn.className = "w-full text-left p-3 hover:bg-gray-50 dark:hover:bg-gray-700 transition border-l-4 border-transparent";

        const labelPromise = isGroup
          ? Promise.resolve(data.title || "Group chat")
          : displayName((data.participants || []).find((p) => p !== user.uid));

        labelPromise.then((name) => {
          const preview = data.lastMessage || "Start chatting";
          const you = data.lastSenderUid === user.uid ? "You: " : "";
          const badge = unread > 0 ? `<span class="ml-auto bg-accent text-white text-xs px-2 py-0.5 rounded-full">${unread}</span>` : "";
          const otherUid = isGroup ? null : (data.participants || []).find((p) => p !== user.uid);
          if (otherUid) ensurePresenceWatch(otherUid);
          const dot = otherUid
            ? `<span data-presence-uid="${otherUid}" class="inline-block w-2 h-2 rounded-full shrink-0 ${presenceDotClass(presenceByUid.get(otherUid)?.online)}"></span>`
            : "";
          btn.innerHTML = `
            <div class="flex items-center gap-2">
              ${dot}
              <div class="min-w-0 flex-1">
                <p class="font-semibold text-sm text-gray-900 dark:text-white truncate">${isGroup ? "👥 " : ""}${escapeHtml(name)}</p>
                <p class="text-xs text-gray-500 truncate">${escapeHtml(you + preview)}</p>
              </div>
              ${badge}
            </div>
          `;
        });

        btn.addEventListener("click", () => {
          if (isGroup) openConversation(convId);
          else {
            const other = (data.participants || []).find((p) => p !== user.uid);
            openConversation(convId, other);
          }
        });
        convList.appendChild(btn);
      });
      maybeOpenFromUrl();
    }

    listenMyConversations(db, renderConversationList, (err) => {
      convList.innerHTML = `<p class="p-4 text-sm text-rose-500">${escapeHtml(err.message || "Could not load conversations.")}</p>`;
      maybeOpenFromUrl();
    });

    let searchTimer;
    userSearch.addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(async () => {
        const term = userSearch.value.trim();
        const searchResults = document.getElementById("searchResults");
        if (!term) {
          searchResults.classList.add("hidden");
          return;
        }
        const profiles = await searchProfilesForMessaging(db, term);
        searchResults.classList.remove("hidden");
        searchResults.innerHTML = "";
        profiles.forEach((p) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "w-full text-left px-2 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-600 text-sm";
          btn.textContent = p.displayName || p.email || "User";
          btn.addEventListener("click", () => {
            userSearch.value = "";
            searchResults.classList.add("hidden");
            openDm(p.uid);
          });
          searchResults.appendChild(btn);
        });
      }, 300);
    });

    document.getElementById("newGroupBtn").addEventListener("click", async () => {
      const title = prompt("Group name", "Friends");
      if (!title) return;
      const handles = prompt("Add people by @handle, comma-separated (e.g. alex, sam)");
      if (!handles) return;
      const uids = handles
        .split(",")
        .map((h) => uidForHandle(h.trim().replace(/^@/, "")))
        .filter(Boolean);
      if (uids.length < 2) {
        showToast("Add at least 2 valid @handles from their profiles.", "error");
        return;
      }
      try {
        const id = await createGroupConversation(db, uids, title);
        showToast("Group created!", "success");
        openConversation(id);
      } catch (e) {
        showToast(e.message, "error");
      }
    });

    document.getElementById("attachImageBtn").addEventListener("click", () => chatImage.click());

    chatInput.addEventListener("input", () => {
      if (!activeConvId) return;
      clearTimeout(typingTimer);
      setTyping(db, activeConvId, true).catch(() => {});
      typingTimer = setTimeout(() => setTyping(db, activeConvId, false).catch(() => {}), 1200);
    });

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!activeTarget) {
        showToast("Select a conversation first.", "error");
        return;
      }
      const text = chatInput.value.trim();
      let imageUrl = null;
      if (chatImage.files?.[0]) {
        const up = await uploadMedia(chatImage.files[0]);
        imageUrl = up.url;
        chatImage.value = "";
      }
      if (!text && !imageUrl) return;

      const payload = { text };
      if (imageUrl) payload.imageUrl = imageUrl;
      if (sharePost && text.includes(sharePost)) payload.postLink = decodeURIComponent(sharePost);

      try {
        chatForm.querySelector("button[type=submit]").disabled = true;
        let target = activeTarget;
        if (!isGroupConversationId(target)) {
          const convId = await getOrCreateConversation(db, target);
          await sendMessage(firebase, target, payload);
        } else {
          await sendMessage(firebase, target, payload);
        }
        chatInput.value = "";
      } catch (err) {
        showToast(err.message || "Send failed.", "error");
      } finally {
        chatForm.querySelector("button[type=submit]").disabled = false;
      }
    });
  </script>
</body>
</html>
