  <script type="module">
    import { initFirebase } from "./src/firebase-config.js";
    import { requireAuth, bootPage } from "./src/page-boot.js";
    import {
      listenMyConversations,
      listenMessages,
      sendMessage,
      getOrCreateConversation,
      conversationId,
      searchProfilesForMessaging,
      getProfileDisplayName,
      escapeHtml,
      markConversationRead,
      markMessagesDelivered,
      setTyping,
      createGroupConversation,
      isGroupConversationId,
    } from "./src/messages.js";
    import {
      subscribePresence,
      messageStatusMeta,
      presenceDotClass,
      isTypingRecent,
    } from "./src/presence.js";
    import { profileUrl } from "./src/profiles-cache.js";
    import { loadProfilesCache, uidForHandle } from "./src/profiles-cache.js";
    import { initDarkMode, showToast } from "./src/ui.js";
    import { uploadMedia } from "./src/image-upload.js";
    import { doc, getDoc, onSnapshot, updateDoc, deleteDoc, deleteField, getDocs, query, collection, orderBy, limit, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebase = initFirebase();
    const user = await requireAuth(firebase);
    if (!user) throw new Error("auth");

    initDarkMode("darkModeToggle");
    bootPage(firebase);

    const db = firebase.__db;
    await loadProfilesCache(db);

    const params = new URLSearchParams(location.search);
    const urlUid = params.get("uid");
    const urlConv = params.get("conv");
    const sharePost = params.get("sharePost");

    const convList = document.getElementById("convList");
    const convListMobile = document.getElementById("convListMobile");
    const chatMessages = document.getElementById("chatMessages");
    const chatHeader = document.getElementById("chatHeader");
    const chatForm = document.getElementById("chatForm");
    const chatInput = document.getElementById("chatInput");
    const chatImage = document.getElementById("chatImage");
    const userSearch = document.getElementById("userSearch");
    const userSearchMobile = document.getElementById("userSearchMobile");
    const sidebar = document.getElementById("sidebar");
    const mobileConvList = document.getElementById("mobileConvList");
    const chatSection = document.getElementById("chatSection");
    const backToConvList = document.getElementById("backToConvList");
    const onlinePeopleMobile = document.getElementById("onlinePeopleMobile");

    let activeTarget = urlConv || urlUid || null;
    let activeConvId = null;
    let activeOtherUid = null;
    let msgUnsub = null;
    let convUnsub = null;
    let typingTimer = null;
    let didInitialOpen = false;
    const nameCache = new Map();
    const presenceByUid = new Map();

    const chatHeaderTitle = document.getElementById("chatHeaderTitle");
    const chatHeaderStatus = document.getElementById("chatHeaderStatus");
    const chatHeaderActions = document.getElementById("chatHeaderActions");
    const chatProfileAvatar = document.getElementById("chatProfileAvatar");
    const onlinePeople = document.getElementById("onlinePeople");

    async function displayName(uid) {
      if (nameCache.has(uid)) return nameCache.get(uid);
      const name = await getProfileDisplayName(db, uid);
      nameCache.set(uid, name);
      return name;
    }

    async function loadOnlinePeople() {
      onlinePeople.innerHTML = "";
      onlinePeopleMobile.innerHTML = "";
      
      // Get online users from presence data
      const onlineUsers = Array.from(presenceByUid.entries())
        .filter(([_, state]) => state.online)
        .map(([uid, _]) => uid);
      
      // If no online users, show suggested users instead
      const usersToShow = onlineUsers.length > 0 ? onlineUsers : [];
      
      // If we have fewer than 8 online users, add some from recent conversations
      if (usersToShow.length < 8) {
        try {
          const convsSnap = await getDocs(query(collection(db, "conversations"), 
            where("participants", "array-contains", user.uid),
            orderBy("updatedAt", "desc"),
            limit(10)));
          
          const recentUids = new Set();
          convsSnap.forEach(convDoc => {
            const participants = convDoc.data().participants || [];
            participants.forEach(uid => {
              if (uid !== user.uid && !usersToShow.includes(uid) && !recentUids.has(uid)) {
                recentUids.add(uid);
              }
            });
          });
          
          // Add recent users to fill up to 8
          for (const uid of recentUids) {
            if (usersToShow.length < 8) {
              usersToShow.push(uid);
            }
          }
        } catch (err) {
          // Ignore errors
        }
      }
      
      if (usersToShow.length === 0) {
        onlinePeople.innerHTML = '<p class="text-sm text-gray-500 dark:text-dark-muted">No users available</p>';
        onlinePeopleMobile.innerHTML = '<p class="text-sm text-gray-500 dark:text-dark-muted">No users available</p>';
        return;
      }
      
      for (const uid of usersToShow.slice(0, 8)) {
        if (uid === user.uid) continue;
        
        const name = await displayName(uid);
        const profileDoc = await getDoc(doc(db, "profiles", uid));
        const profileData = profileDoc.data();
        const isOnline = presenceByUid.get(uid)?.online || false;
        
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "flex-shrink-0 group relative";
        btn.title = name;
        
        let avatarHtml;
        if (profileData?.photoUrl) {
          avatarHtml = `<img src="${profileData.photoUrl}" alt="${escapeHtml(name)}" class="w-12 h-12 rounded-full object-cover border-2 ${isOnline ? 'border-green-500' : 'border-gray-300 dark:border-gray-600'} group-hover:scale-110 transition-transform" />`;
        } else {
          avatarHtml = `<div class="w-12 h-12 rounded-full bg-gradient-to-br from-accent to-purple-600 flex items-center justify-center text-white font-semibold text-lg border-2 ${isOnline ? 'border-green-500' : 'border-gray-300 dark:border-gray-600'} group-hover:scale-110 transition-transform">${name.charAt(0).toUpperCase()}</div>`;
        }
        
        btn.innerHTML = `
          ${avatarHtml}
          ${isOnline ? '<span class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 rounded-full border-2 border-white dark:border-dark-surface"></span>' : ''}
        `;
        
        btn.addEventListener("click", () => openDm(uid));
        onlinePeople.appendChild(btn.cloneNode(true));
        onlinePeopleMobile.appendChild(btn.cloneNode(true));
      }
      
      // Add a "See all" button if we have more users
      if (usersToShow.length > 8) {
        const seeAllBtn = document.createElement("button");
        seeAllBtn.type = "button";
        seeAllBtn.className = "flex-shrink-0 w-12 h-12 rounded-full bg-gray-100 dark:bg-gray-700 flex items-center justify-center text-gray-600 dark:text-gray-400 font-semibold text-sm border-2 border-gray-300 dark:border-gray-600 hover:scale-110 transition-transform";
        seeAllBtn.textContent = "+";
        seeAllBtn.title = "See more users";
        seeAllBtn.addEventListener("click", () => {
          // Could open a modal with all users
          showToast("More users coming soon!", "info");
        });
        onlinePeople.appendChild(seeAllBtn);
        onlinePeopleMobile.appendChild(seeAllBtn.cloneNode(true));
      }
    }

    function showMobileChat() {
      mobileConvList.classList.add("hidden");
      chatSection.classList.remove("hidden");
      chatSection.classList.add("flex");
    }

    function showMobileConvList() {

    function showReactionPicker(messageId) {
      const picker = document.createElement("div");
      picker.className = "absolute bg-white dark:bg-gray-800 rounded-xl shadow-lg border border-gray-200 dark:border-gray-700 p-2 flex gap-2 z-50 animate-fade-in";

      picker.setAttribute("role", "dialog");
      picker.setAttribute("aria-label", "Select reaction");
      
      reactionEmojis.forEach((emoji, index) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "text-2xl hover:scale-125 transition-transform p-1 focus:outline-none focus:ring-2 focus:ring-accent rounded";
        btn.textContent = emoji;
        btn.setAttribute("aria-label", `React with ${emoji}`);

        btn.addEventListener("click", () => {
          toggleReaction(messageId, emoji);

          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();

            picker.remove();

          if (e.key === "Escape") {
            picker.remove();
          }
        });
        picker.appendChild(btn);
      });

      setTimeout(() => picker.querySelector("button")?.focus(), 100);

      const closePicker = (e) => {
        if (!picker.contains(e.target)) {
          picker.remove();
          document.removeEventListener("click", closePicker);
        }
      };
      setTimeout(() => document.addEventListener("click", closePicker), 100);
      
      chatMessages.appendChild(picker);

    async function toggleReaction(messageId, emoji) {
      if (!activeConvId) return;
      
      const msgRef = doc(db, "conversations", activeConvId, "messages", messageId);
      const msgSnap = await getDoc(msgRef);
      const msgData = msgSnap.data();
      
      const reactions = msgData.reactions || {};
      const emojiReactors = reactions[emoji] || [];
      
      if (emojiReactors.includes(user.uid)) {
        // Remove reaction
        reactions[emoji] = emojiReactors.filter(uid => uid !== user.uid);
        if (reactions[emoji].length === 0) delete reactions[emoji];
      } else {
        // Add reaction
        reactions[emoji] = [...emojiReactors, user.uid];
      }
      
      await updateDoc(msgRef, { reactions });
    }
    
    async function editMessage(messageId, currentText) {
      const newText = prompt("Edit your message:", currentText);
      if (!newText || newText === currentText || newText.trim() === "") return;
      
      const msgRef = doc(db, "conversations", activeConvId, "messages", messageId);
      await updateDoc(msgRef, { 
        text: newText.trim(),
        edited: true,
        editedAt: new Date().toISOString()
      });
    }
    
    async function deleteMessage(messageId) {
      if (!confirm("Are you sure you want to delete this message?")) return;
      
      const msgRef = doc(db, "conversations", activeConvId, "messages", messageId);
      await deleteDoc(msgRef);
    }

    async function toggleMuteConversation(convId, isMuted) {
      try {

        if (isMuted) {
          await updateDoc(convRef, {
            [`muted.${user.uid}`]: deleteField()
          });
          showToast("Conversation unmuted");

          await updateDoc(convRef, {

          });

        showToast("Failed to toggle mute: " + err.message, "error");

    // Global message search across all conversations
    const globalMessageSearch = document.getElementById('globalMessageSearch');
    const globalMessageSearchResults = document.getElementById('globalMessageSearchResults');
    let allConversations = [];

    // Store conversations for global search
    function storeConversationsForSearch(snap) {
      allConversations = snap.docs.map(d => ({ id: d.id, data: d.data() }));
    }

    // Override renderConversationList to store conversations
    const originalRenderConversationList = renderConversationList;
    renderConversationList = function(snap) {
      storeConversationsForSearch(snap);
      originalRenderConversationList(snap);
    };

    // Global message search handler
    let globalSearchTimer;
    globalMessageSearch.addEventListener('input', () => {
      clearTimeout(globalSearchTimer);
      globalSearchTimer = setTimeout(async () => {
        const query = globalMessageSearch.value.toLowerCase().trim();
        
        if (query.length === 0) {
          globalMessageSearchResults.classList.add('hidden');
          return;
        }

        const results = [];
        
        // Search through all conversations
        for (const conv of allConversations) {
          const convData = conv.data;
          const isGroup = convData.type === "group" || isGroupConversationId(conv.id);
          
          // Skip deleted/archived conversations
          if (convData.deleted?.[user.uid] || convData.archived?.[user.uid]) continue;
          
          // Search messages in this conversation
          try {
            const messagesSnap = await getDocs(query(collection(db, "conversations", conv.id, "messages"), 
              orderBy("createdAt", "desc"), limit(50)));
            
            messagesSnap.forEach(msgDoc => {
              const msg = msgDoc.data();
              if (msg.text && msg.text.toLowerCase().includes(query)) {
                const name = isGroup 
                  ? convData.title || "Group chat"
                  : (convData.participants || []).find(p => p !== user.uid);
                
                results.push({
                  convId: conv.id,
                  msgId: msgDoc.id,
                  text: msg.text,
                  convName: name,
                  isGroup,
                  timestamp: msg.createdAt
                });
              }
            });
          } catch (err) {
            // Skip conversations we can't access
          }
        }

        if (results.length === 0) {
          globalMessageSearchResults.innerHTML = '<div class="p-3 text-sm text-gray-500 dark:text-gray-400">No messages found</div>';
          globalMessageSearchResults.classList.remove('hidden');
          return;
        }

        // Sort by timestamp (most recent first)
        results.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

        globalMessageSearchResults.innerHTML = results.slice(0, 20).map(r => `
          <div class="p-3 border-b border-gray-100 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700 cursor-pointer transition" data-conv-id="${r.convId}" data-msg-id="${r.msgId}">
            <p class="text-xs font-semibold text-gray-500 dark:text-gray-400 mb-1">${r.isGroup ? '👥 ' : ''}${escapeHtml(r.convName)}</p>
            <p class="text-sm text-gray-900 dark:text-white line-clamp-2">${escapeHtml(r.text)}</p>
            <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">${new Date(r.timestamp).toLocaleString()}</p>
          </div>
        `).join('');

        globalMessageSearchResults.classList.remove('hidden');

        // Add click handlers to open conversation and scroll to message
        globalMessageSearchResults.querySelectorAll('[data-conv-id]').forEach(item => {
          item.addEventListener('click', async () => {
            const convId = item.dataset.convId;
            const msgId = item.dataset.msgId;
            
            const isGroup = isGroupConversationId(convId);
            const conv = allConversations.find(c => c.id === convId);
            if (conv) {
              const otherUid = isGroup ? null : (conv.data.participants || []).find(p => p !== user.uid);
              await openConversation(convId, otherUid);
              
              // Wait for messages to load, then scroll to the message
              setTimeout(() => {
                const messageElement = document.querySelector(`[data-message-id="${msgId}"]`);
                if (messageElement) {
                  messageElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
                  messageElement.classList.add('ring-2', 'ring-accent');
                  setTimeout(() => messageElement.classList.remove('ring-2', 'ring-accent'), 3000);
                }

            }
            
            globalMessageSearchResults.classList.add('hidden');
            globalMessageSearch.value = '';
          });
        });
      }, 500);
    });

      if (snap.empty) {
        chatMessages.innerHTML = '<p class="text-sm text-gray-500 text-center py-8">No messages yet. Say hello!</p>';
        return;
      }
      snap.forEach((d) => {
        const m = d.data();

        allMessages.push(m); // Add to message cache for search
        
        const mine = m.senderUid === user.uid;
        const wrap = document.createElement("div");
        wrap.className = mine ? "flex flex-col items-end" : "flex flex-col items-start";
        wrap.setAttribute('data-message-id', d.id); // Add data attribute for search

          mine ? "bg-accent text-white" : "bg-gray-100 dark:bg-gray-700 text-gray-900 dark:text-white"
        }`;
        
        // Show reply information if this is a reply
        if (m.replyTo) {

          replyDiv.className = "text-xs opacity-70 border-l-2 border-gray-400 dark:border-gray-500 pl-2 mb-2";
          replyDiv.innerHTML = `<span class="font-semibold">↩️ Reply:</span> ${m.replyTo.text}`;
          inner.appendChild(replyDiv);
        }
        
        if (m.text) {
          const p = document.createElement("p");
          p.textContent = m.text;
          inner.appendChild(p);
        }
        
        // Show edited indicator
        if (m.edited) {
          const editedSpan = document.createElement("span");
          editedSpan.className = "text-[10px] opacity-70";
          editedSpan.textContent = "(edited)";
          inner.appendChild(editedSpan);
        }
        
        if (m.imageUrl) {
          const imgContainer = document.createElement("div");
          imgContainer.className = "relative group cursor-pointer";
          
          const img = document.createElement("img");
          img.src = m.imageUrl;
          img.alt = "Image";
          img.className = "max-w-full rounded-xl max-h-48 object-cover transition-transform group-hover:scale-105";
          img.loading = "lazy";
          
          // Add click handler for full-size preview

      });
      chatMessages.scrollTop = chatMessages.scrollHeight;
      if (activeConvId) markMessagesDelivered(db, activeConvId).catch(() => {});

    function updateChatPresenceLabel(state, typing = false) {
      if (!chatHeaderStatus) return;
      if (typing) {
        chatHeaderStatus.textContent = "typing...";
        chatHeaderStatus.classList.remove("hidden", "text-emerald-500");
        chatHeaderStatus.classList.add("text-accent");
        return;
      }
      if (!state) {
        chatHeaderStatus.classList.add("hidden");
        return;
      }
      chatHeaderStatus.classList.remove("hidden", "text-accent");
      chatHeaderStatus.classList.toggle("text-emerald-500", state.online);
      chatHeaderStatus.classList.toggle("text-gray-500", !state.online);
      chatHeaderStatus.textContent = state.label;
    }

    function ensurePresenceWatch(uid) {
      if (!uid) return;
      if (presenceByUid.has(uid)) return;
      presenceByUid.set(uid, { online: false, label: "Offline" });
      subscribePresence(db, uid, (state) => {
        presenceByUid.set(uid, state);
        document.querySelectorAll(`[data-presence-uid="${uid}"]`).forEach((dot) => {
          dot.className = `inline-block w-2 h-2 rounded-full shrink-0 ${presenceDotClass(state.online)}`;
          dot.title = state.label;
        });
        if (uid === activeOtherUid) updateChatPresenceLabel(state, false);
        // Refresh online people section when presence changes
        loadOnlinePeople().catch(() => {});
      });
    }

    async function openConversation(convId, otherUid = null) {
      if (!convId) return;
      if (activeConvId === convId && msgUnsub) {
        setActiveConv(convId, otherUid);
        return;
      }

      activeConvId = convId;
      activeOtherUid = otherUid;
      activeTarget = isGroupConversationId(convId) ? convId : otherUid || activeTarget;

      history.replaceState(
        null,
        "",
        isGroupConversationId(convId) ? `?conv=${encodeURIComponent(convId)}` : `?uid=${encodeURIComponent(otherUid || activeTarget)}`
      );

      // Show mobile chat when opening a conversation
      showMobileChat();

      if (msgUnsub) {
        msgUnsub();
        msgUnsub = null;
      }
      if (convUnsub) {
        convUnsub();
        convUnsub = null;
      }

      chatForm.classList.remove("hidden");
      setActiveConv(convId, otherUid);
      await markConversationRead(db, convId);
      await markMessagesDelivered(db, convId);

      const convSnap = await getDoc(doc(db, "conversations", convId));
      const convData = convSnap.data() || {};
      const isGroup = convData.type === "group" || isGroupConversationId(convId);

      chatHeaderActions.innerHTML = "";
      chatHeaderStatus.classList.add("hidden");
      chatProfileAvatar.innerHTML = '<span class="text-gray-400">?</span>';

      // Add search button
      const searchBtn = document.createElement('button');
      searchBtn.id = 'toggleMessageSearchBtn';
      searchBtn.className = 'p-2 rounded-xl border border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-700 hover:scale-105 active:scale-95 transition-all duration-200';
      searchBtn.setAttribute('aria-label', 'Search messages');
      searchBtn.innerHTML = '<svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>';
      chatHeaderActions.appendChild(searchBtn);
      
      // Add mute button
      const muteBtn = document.createElement('button');
      muteBtn.className = 'p-2 rounded-xl border border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-700 hover:scale-105 active:scale-95 transition-all duration-200';
      muteBtn.setAttribute('aria-label', 'Mute conversation');
      muteBtn.innerHTML = '<svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" clip-rule="evenodd"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/></svg>';
      muteBtn.addEventListener('click', () => {
        const isMuted = convData.muted?.[user.uid];
        toggleMuteConversation(convId, isMuted);
      });
      chatHeaderActions.appendChild(muteBtn);
      
      // Re-attach event listener to search button
      searchBtn.addEventListener('click', () => {
        messageSearchContainer.classList.toggle('hidden');
        if (!messageSearchContainer.classList.contains('hidden')) {
          messageSearchInput.focus();
        }
      });

      if (isGroup) {
        chatHeaderTitle.textContent = convData.title || "Group chat";
        chatHeaderStatus.textContent = `${(convData.participants || []).length} members`;
        chatHeaderStatus.classList.remove("hidden");
        chatHeaderStatus.classList.remove("text-emerald-500", "text-accent");
        chatHeaderStatus.classList.add("text-gray-500");
        chatProfileAvatar.innerHTML = '<span class="text-2xl">👥</span>';
      } else {
        const uid = otherUid || (convData.participants || []).find((p) => p !== user.uid);
        activeOtherUid = uid;
        const name = await displayName(uid);
        
        // Fetch full profile data
        const profileDoc = await getDoc(doc(db, "profiles", uid));
        const profileData = profileDoc.data();
        
        // Build enhanced header with profile details
        const bio = profileData?.bio || "";
        const location = profileData?.location || "";
        const website = profileData?.website || "";
        const verified = profileData?.verified || false;
        const followers = profileData?.followers?.length || 0;
        const following = profileData?.following?.length || 0;
        
        let headerContent = `<a href="${profileUrl(uid)}" class="hover:text-accent transition flex items-center gap-2">${escapeHtml(name)}${verified ? '<span class="text-blue-500">✓</span>' : ''}</a>`;
        
        // Add bio if available
        if (bio) {
          headerContent += `<p class="text-xs text-gray-500 dark:text-gray-400 mt-1 max-w-[200px] truncate">${escapeHtml(bio)}</p>`;
        }
        
        // Add location if available
        if (location) {
          headerContent += `<p class="text-xs text-gray-500 dark:text-gray-400 flex items-center gap-1"><svg class="h-3 w-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>${escapeHtml(location)}</p>`;
        }
        
        chatHeaderTitle.innerHTML = headerContent;
        
        // Fetch and display profile photo
        if (profileData?.photoUrl) {
          chatProfileAvatar.innerHTML = `<img src="${profileData.photoUrl}" alt="${escapeHtml(name)}" class="w-full h-full object-cover" />`;
        } else {
          chatProfileAvatar.innerHTML = `<span class="text-xl font-semibold text-gray-500">${name.charAt(0).toUpperCase()}</span>`;
        }
        
        // Add profile details dropdown button
        const detailsBtn = document.createElement('button');
        detailsBtn.className = 'p-2 rounded-xl border border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-700 hover:scale-105 active:scale-95 transition-all duration-200';
        detailsBtn.setAttribute('aria-label', 'Profile details');
        detailsBtn.innerHTML = '<svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>';
        detailsBtn.addEventListener('click', () => showProfileDetails(uid, profileData));
        chatHeaderActions.appendChild(detailsBtn);

        const profileLink = document.createElement("a");
        profileLink.href = profileUrl(uid);
        profileLink.className = "text-xs text-accent font-medium hover:scale-105 active:scale-95 transition-all duration-200";
        profileLink.textContent = "View profile";
        chatHeaderActions.appendChild(profileLink);

        ensurePresenceWatch(uid);
        updateChatPresenceLabel(presenceByUid.get(uid));
      }

      convUnsub = onSnapshot(doc(db, "conversations", convId), (snap) => {
        const data = snap.data() || {};
        if (isGroup || !activeOtherUid) return;
        const typingAt = data.typing?.[activeOtherUid];
        if (isTypingRecent(typingAt)) {
          updateChatPresenceLabel(presenceByUid.get(activeOtherUid), true);
        } else {
          updateChatPresenceLabel(presenceByUid.get(activeOtherUid), false);
        }
      });

      if (sharePost && !chatInput.value) {
        chatInput.value = `Check this out: ${decodeURIComponent(sharePost)}`;
      }

      msgUnsub = listenMessages(db, convId, renderMessages, (err) => {
        chatMessages.innerHTML = `<p class="text-sm text-rose-500 p-4">${escapeHtml(err.message || "Could not load messages.")}</p>`;
      });
      chatInput.focus();
    }

    async function openDm(otherUid) {
      const convId = await getOrCreateConversation(db, otherUid);
      await openConversation(convId, otherUid);
    }

    function maybeOpenFromUrl() {
      if (didInitialOpen) return;
      didInitialOpen = true;
      if (urlConv) openConversation(urlConv);
      else if (urlUid) openDm(urlUid);
    }

    function renderConversationList(snap) {
      convList.innerHTML = "";
      convListMobile.innerHTML = "";
      if (snap.empty) {
        convList.innerHTML = '<p class="p-4 text-sm text-gray-500">No conversations yet.</p>';
        convListMobile.innerHTML = '<p class="p-4 text-sm text-gray-500">No conversations yet.</p>';
        maybeOpenFromUrl();
        return;
      }

      snap.docs.forEach((d) => {
        const data = d.data();
        const convId = d.id;
        const unread = data.unreadCounts?.[user.uid] || 0;
        const isGroup = data.type === "group" || isGroupConversationId(convId);

        const labelPromise = isGroup
          ? Promise.resolve(data.title || "Group chat")
          : displayName((data.participants || []).find((p) => p !== user.uid));

        labelPromise.then((name) => {
          const otherUid = isGroup ? null : (data.participants || []).find((p) => p !== user.uid);
          if (otherUid) ensurePresenceWatch(otherUid);
          
          // Check if someone is typing
          const typingAt = data.typing?.[otherUid];
          const isTyping = isTypingRecent(typingAt);
          const preview = isTyping ? "typing..." : (data.lastMessage || "Start chatting");
          const you = data.lastSenderUid === user.uid && !isTyping ? "You: " : "";
          const badge = unread > 0 ? `<span class="ml-auto bg-accent text-white text-xs px-2 py-0.5 rounded-full">${unread}</span>` : "";
          
          // Format timestamp
          let timestamp = "";
          if (data.lastMessageAt && !isTyping) {
            const date = new Date(data.lastMessageAt);
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);
            const diffDays = Math.floor(diffMs / 86400000);
            
            if (diffMins < 1) timestamp = "now";
            else if (diffMins < 60) timestamp = `${diffMins}m`;
            else if (diffHours < 24) timestamp = `${diffHours}h`;
            else if (diffDays < 7) timestamp = `${diffDays}d`;
            else timestamp = date.toLocaleDateString();
          }
          
          const dot = otherUid
            ? `<span data-presence-uid="${otherUid}" class="inline-block w-2 h-2 rounded-full shrink-0 ${presenceDotClass(presenceByUid.get(otherUid)?.online)}"></span>`
            : "";
          
          const btn = document.createElement("button");
          btn.type = "button";
          btn.dataset.convId = convId;
          btn.dataset.otherUid = otherUid || "";
          btn.className = "w-full text-left p-3 hover:bg-gray-50 dark:hover:bg-gray-700 transition border-l-4 border-transparent relative group";
          const isMuted = data.muted?.[user.uid];
          const isArchived = data.archived?.[user.uid];
          btn.innerHTML = `
            <div class="flex items-center gap-2">
              ${dot}
              <div class="min-w-0 flex-1">
                <p class="font-semibold text-sm text-gray-900 dark:text-white truncate">${isGroup ? "👥 " : ""}${escapeHtml(name)}</p>
                <p class="text-xs ${isTyping ? 'text-accent font-medium' : 'text-gray-500'} truncate">${escapeHtml(you + preview)}</p>
              </div>
              <div class="flex flex-col items-end gap-1">
                ${badge}
                ${timestamp ? `<span class="text-[10px] text-gray-400">${timestamp}</span>` : ""}
              </div>
              ${isMuted ? '<span class="absolute top-2 right-2 text-xs">🔇</span>' : ''}
              ${isArchived ? '<span class="absolute top-2 right-8 text-xs">📦</span>' : ''}
            </div>
            <div class="hidden group-hover:flex absolute top-2 right-2 gap-1 bg-white dark:bg-gray-800 rounded-lg shadow-lg border border-gray-200 dark:border-gray-700 p-1 z-10">
              <button type="button" class="archive-btn p-1 hover:bg-gray-100 dark:hover:bg-gray-700 rounded text-xs" title="${isArchived ? 'Unarchive' : 'Archive'}">${isArchived ? '📤' : '📦'}</button>
              <button type="button" class="delete-btn p-1 hover:bg-gray-100 dark:hover:bg-gray-700 rounded text-xs" title="Delete">🗑️</button>
            </div>
          `;

          btn.addEventListener("click", (e) => {
            // Check if clicked on archive/delete buttons
            if (e.target.closest('.archive-btn')) {
              e.stopPropagation();
              toggleArchiveConversation(convId, isArchived);
              return;
            }
            if (e.target.closest('.delete-btn')) {
              e.stopPropagation();
              deleteConversation(convId);
              return;
            }
            
            if (isGroup) openConversation(convId);
            else {
              const other = (data.participants || []).find((p) => p !== user.uid);
              openConversation(convId, other);
            }
          });
          
          convList.appendChild(btn);
          
          // Clone for mobile and re-attach event listener
          const mobileBtn = btn.cloneNode(true);
          mobileBtn.addEventListener("click", (e) => {
            // Check if clicked on archive/delete buttons
            if (e.target.closest('.archive-btn')) {
              e.stopPropagation();
              toggleArchiveConversation(convId, isArchived);
              return;
            }
            if (e.target.closest('.delete-btn')) {
              e.stopPropagation();
              deleteConversation(convId);
              return;
            }
            
            if (isGroup) openConversation(convId);
            else {
              const other = (data.participants || []).find((p) => p !== user.uid);
              openConversation(convId, other);
            }
          });
          convListMobile.appendChild(mobileBtn);
        });
      });
      maybeOpenFromUrl();
    }

    listenMyConversations(db, renderConversationList, (err) => {
      convList.innerHTML = `<p class="p-4 text-sm text-rose-500">${escapeHtml(err.message || "Could not load conversations.")}</p>`;
      maybeOpenFromUrl();
    });

    // Load online people initially
    loadOnlinePeople().catch(() => {});

    // Back button for mobile
    backToConvList.addEventListener("click", () => {
      showMobileConvList();
    });

    let searchTimer;
    userSearch.addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(async () => {
        const term = userSearch.value.trim();
        const searchResults = document.getElementById("searchResults");

          searchResults.classList.add("hidden");

        const term = userSearchMobile.value.trim();

          btn.textContent = p.displayName || p.email || "User";

            userSearchMobile.value = "";
            searchResultsMobile.classList.add("hidden");
            openDm(p.uid);
          });
          searchResultsMobile.appendChild(btn);
        });
      }, 300);
    });

    document.getElementById("newGroupBtn").addEventListener("click", async () => {
      const title = prompt("Group name", "Friends");
      if (!title) return;
      const handles = prompt("Add people by @handle, comma-separated (e.g. alex, sam)");
      if (!handles) return;
      const uids = handles
        .split(",")
        .map((h) => uidForHandle(h.trim().replace(/^@/, "")))
        .filter(Boolean);

    // Mobile group button
    document.getElementById("newGroupBtnMobile").addEventListener("click", async () => {
      const title = prompt("Group name", "Friends");
      if (!title) return;
      const handles = prompt("Add people by @handle, comma-separated (e.g. alex, sam)");
      if (!handles) return;
      const uids = handles
        .split(",")
        .map((h) => uidForHandle(h.trim().replace(/^@/, "")))
        .filter(Boolean);
      if (uids.length < 2) {
        showToast("Add at least 2 valid @handles from their profiles.", "error");
        return;
      }
      try {
        const id = await createGroupConversation(db, uids, title);
        showToast("Group created!", "success");
        openConversation(id);
      } catch (e) {
        showToast(e.message, "error");
      }

    document.getElementById("attachImageBtn").addEventListener("click", () => chatImage.click());

    chatInput.addEventListener("input", () => {
      if (!activeConvId) return;
      clearTimeout(typingTimer);
      setTyping(db, activeConvId, true).catch(() => {});
      typingTimer = setTimeout(() => setTyping(db, activeConvId, false).catch(() => {}), 1200);
    });

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!activeTarget) {
        showToast("Select a conversation first.", "error");
        return;
      }
      const text = chatInput.value.trim();
      let imageUrl = null;
      if (chatImage.files?.[0]) {
        const up = await uploadMedia(chatImage.files[0]);
        imageUrl = up.url;
        chatImage.value = "";
      }
      if (!text && !imageUrl) return;

      const payload = { text };
      if (imageUrl) payload.imageUrl = imageUrl;
      if (sharePost && text.includes(sharePost)) payload.postLink = decodeURIComponent(sharePost);
      
      // Add reply information if replying to a message
      if (replyToMessage) {
        payload.replyTo = {
          messageId: replyToMessage.messageId,
          text: replyToMessage.text,
          senderUid: replyToMessage.senderUid
        };
      }

      try {
        chatForm.querySelector("button[type=submit]").disabled = true;
        let target = activeTarget;
        if (!isGroupConversationId(target)) {
          const convId = await getOrCreateConversation(db, target);
          await sendMessage(firebase, target, payload);
        } else {
          await sendMessage(firebase, target, payload);
        }
        chatInput.value = "";
        cancelReply(); // Clear reply context after sending
      } catch (err) {
        showToast(err.message || "Send failed.", "error");
      } finally {
        chatForm.querySelector("button[type=submit]").disabled = false;
      }
    });
  </script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(registration => {
            console.log('Service Worker registered with scope:', registration.scope);
          })
          .catch(error => {
            console.log('Service Worker registration failed:', error);
          });
      });
    }
  </script>
</body>
</html>
