<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SnapVerse • Messages</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="murray.png" type="image/png" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { accent: '#e94560', primary: '#1a1a2e' } } } }
    };
  </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 font-sans min-h-screen">
  <nav class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 px-4 py-3">
    <div class="max-w-5xl mx-auto flex items-center justify-between gap-2">
      <a href="/index.html" class="font-bold text-accent shrink-0">← Feed</a>
      <h1 class="font-bold">Messages</h1>
      <button type="button" id="darkModeToggle" class="p-2 rounded-lg border border-gray-200 dark:border-gray-600 text-sm">🌙</button>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto p-4 grid lg:grid-cols-[300px_1fr] gap-4 min-h-[calc(100vh-4rem)]">
    <aside class="bg-white dark:bg-gray-800 rounded-2xl border border-gray-200 dark:border-gray-700 overflow-hidden flex flex-col max-h-[calc(100vh-6rem)]">
      <div class="p-3 border-b border-gray-200 dark:border-gray-700">
        <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide">New message</label>
        <input
          id="userSearch"
          type="search"
          placeholder="Search people..."
          class="mt-2 w-full rounded-xl border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 px-3 py-2 text-sm"
        />
        <div id="searchResults" class="mt-2 max-h-32 overflow-y-auto hidden"></div>
      </div>
      <div class="p-3 border-b border-gray-200 dark:border-gray-700 font-semibold text-sm">Conversations</div>
      <div id="convList" class="flex-1 overflow-y-auto divide-y divide-gray-100 dark:divide-gray-700">
        <p class="p-4 text-sm text-gray-500">Loading...</p>
      </div>
    </aside>

    <section class="bg-white dark:bg-gray-800 rounded-2xl border border-gray-200 dark:border-gray-700 flex flex-col min-h-[400px] max-h-[calc(100vh-6rem)]">
      <div id="chatHeader" class="p-4 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between gap-2">
        <span class="font-semibold">Select a conversation</span>
      </div>
      <div id="chatMessages" class="flex-1 overflow-y-auto p-4 space-y-3 min-h-[200px]">
        <p class="text-sm text-gray-500 text-center py-8">Pick someone from the list or search to start chatting.</p>
      </div>
      <form id="chatForm" class="p-4 border-t border-gray-200 dark:border-gray-700 flex gap-2 hidden">
        <input
          id="chatInput"
          type="text"
          maxlength="500"
          required
          placeholder="Type a message..."
          class="flex-1 rounded-xl border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 px-4 py-2 text-sm text-gray-900 dark:text-white"
        />
        <button type="submit" class="px-4 py-2 rounded-xl bg-accent text-white font-semibold text-sm shrink-0">Send</button>
      </form>
    </section>
  </main>

  <script type="module">
    import { initFirebase } from "./src/firebase-config.js";
    import { requireAuth, bootPage } from "./src/page-boot.js";
    import {
      listenMyConversations,
      listenMessages,
      sendMessage,
      getOrCreateConversation,
      conversationId,
      searchProfilesForMessaging,
      getProfileDisplayName,
      escapeHtml,
    } from "./src/messages.js";
    import { profileUrl } from "./src/profiles-cache.js";
    import { initDarkMode, showToast } from "./src/ui.js";

    const firebase = initFirebase();
    const user = await requireAuth(firebase);
    if (!user) throw new Error("auth");

    initDarkMode("darkModeToggle");
    bootPage(firebase);

    const db = firebase.__db;
    const convList = document.getElementById("convList");
    const chatMessages = document.getElementById("chatMessages");
    const chatHeader = document.getElementById("chatHeader");
    const chatForm = document.getElementById("chatForm");
    const chatInput = document.getElementById("chatInput");
    const userSearch = document.getElementById("userSearch");
    const searchResults = document.getElementById("searchResults");

    const urlUid = new URLSearchParams(location.search).get("uid");
    let activeOtherUid = urlUid;
    let msgUnsub = null;
    let convUnsub = null;
    let currentChatUid = null;
    let didInitialOpen = false;
    const nameCache = new Map();

    function maybeOpenFromUrl() {
      if (urlUid && !didInitialOpen) {
        didInitialOpen = true;
        openChat(urlUid);
      }
    }

    async function displayName(uid) {
      if (nameCache.has(uid)) return nameCache.get(uid);
      const name = await getProfileDisplayName(db, uid);
      nameCache.set(uid, name);
      return name;
    }

    function setActiveConvButton(otherUid) {
      convList.querySelectorAll("[data-other-uid]").forEach((btn) => {
        const active = btn.dataset.otherUid === otherUid;
        btn.classList.toggle("bg-accent/10", active);
        btn.classList.toggle("border-l-4", active);
        btn.classList.toggle("border-accent", active);
      });
    }

    function renderMessages(snap) {
      chatMessages.innerHTML = "";
      if (snap.empty) {
        chatMessages.innerHTML =
          '<p class="text-sm text-gray-500 text-center py-8">No messages yet. Say hello!</p>';
        return;
      }
      snap.forEach((d) => {
        const m = d.data();
        const mine = m.senderUid === user.uid;
        const bubble = document.createElement("div");
        bubble.className = mine ? "flex justify-end" : "flex justify-start";
        const inner = document.createElement("div");
        inner.className = `max-w-[85%] rounded-2xl px-4 py-2 text-sm break-words ${
          mine ? "bg-accent text-white" : "bg-gray-100 dark:bg-gray-700 text-gray-900 dark:text-white"
        }`;
        inner.textContent = m.text || "";
        bubble.appendChild(inner);
        chatMessages.appendChild(bubble);
      });
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function openChat(otherUid) {
      if (!otherUid) return;
      if (currentChatUid === otherUid && msgUnsub) {
        setActiveConvButton(otherUid);
        return;
      }
      activeOtherUid = otherUid;
      currentChatUid = otherUid;
      history.replaceState(null, "", `?uid=${encodeURIComponent(otherUid)}`);

      if (msgUnsub) {
        msgUnsub();
        msgUnsub = null;
      }

      chatForm.classList.remove("hidden");
      setActiveConvButton(otherUid);

      const name = await displayName(otherUid);
      chatHeader.innerHTML = `
        <a href="${profileUrl(otherUid)}" class="font-semibold hover:text-accent transition">${escapeHtml(name)}</a>
        <a href="${profileUrl(otherUid)}" class="text-xs text-accent font-medium shrink-0">View profile</a>
      `;

      const convId = conversationId(user.uid, otherUid);
      await getOrCreateConversation(db, otherUid);

      msgUnsub = listenMessages(
        db,
        convId,
        renderMessages,
        (err) => {
          chatMessages.innerHTML = `<p class="text-sm text-rose-500 p-4">${escapeHtml(err.message || "Could not load messages.")}</p>`;
        }
      );

      chatInput.focus();
    }

    function renderConversationList(snap) {
      convList.innerHTML = "";
      if (snap.empty) {
        convList.innerHTML =
          '<p class="p-4 text-sm text-gray-500">No conversations yet. Search above or message someone from their profile.</p>';
        maybeOpenFromUrl();
        return;
      }

      snap.docs.forEach((d) => {
        const data = d.data();
        const other = (data.participants || []).find((p) => p !== user.uid);
        if (!other) return;

        const btn = document.createElement("button");
        btn.type = "button";
        btn.dataset.otherUid = other;
        btn.className = "w-full text-left p-3 hover:bg-gray-50 dark:hover:bg-gray-700 transition border-l-4 border-transparent";

        displayName(other).then((name) => {
          const preview = data.lastMessage || "Start chatting";
          const you = data.lastSenderUid === user.uid ? "You: " : "";
          btn.innerHTML = `
            <p class="font-semibold text-sm text-gray-900 dark:text-white">${escapeHtml(name)}</p>
            <p class="text-xs text-gray-500 truncate">${escapeHtml(you + preview)}</p>
          `;
        });

        btn.addEventListener("click", () => openChat(other));
        convList.appendChild(btn);
      });

      maybeOpenFromUrl();
    }

    convUnsub = listenMyConversations(
      db,
      renderConversationList,
      (err) => {
        const needsIndex = String(err?.message || "").includes("index");
        convList.innerHTML = needsIndex
          ? '<p class="p-4 text-sm text-rose-500">Firestore index required. Run deploy-firestore.ps1 or create index: conversations → participants (array) + updatedAt (desc).</p>'
          : `<p class="p-4 text-sm text-rose-500">${escapeHtml(err.message || "Could not load conversations.")}</p>`;
        maybeOpenFromUrl();
      }
    );

    let searchTimer;
    userSearch.addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(async () => {
        const term = userSearch.value.trim();
        if (!term) {
          searchResults.classList.add("hidden");
          searchResults.innerHTML = "";
          return;
        }
        const profiles = await searchProfilesForMessaging(db, term);
        searchResults.classList.remove("hidden");
        searchResults.innerHTML = "";
        if (!profiles.length) {
          searchResults.innerHTML = '<p class="text-xs text-gray-500 p-2">No users found</p>';
          return;
        }
        profiles.forEach((p) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "w-full text-left px-2 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-600 text-sm";
          btn.textContent = p.displayName || p.email || "User";
          btn.addEventListener("click", () => {
            userSearch.value = "";
            searchResults.classList.add("hidden");
            openChat(p.uid);
          });
          searchResults.appendChild(btn);
        });
      }, 300);
    });

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!activeOtherUid) {
        showToast("Select a conversation first.", "error");
        return;
      }
      const text = chatInput.value;
      if (!text.trim()) return;
      try {
        chatForm.querySelector("button[type=submit]").disabled = true;
        await sendMessage(firebase, activeOtherUid, text);
        chatInput.value = "";
      } catch (err) {
        showToast(err.message || "Send failed.", "error");
      } finally {
        chatForm.querySelector("button[type=submit]").disabled = false;
        chatInput.focus();
      }
    });
  </script>
</body>
</html>
