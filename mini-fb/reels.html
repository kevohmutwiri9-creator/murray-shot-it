<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SnapVerse • Reels</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="murray.png" type="image/png" />
  <script>
    tailwind.config = { darkMode: "class", theme: { extend: { colors: { accent: "#e94560" } } } };
  </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 font-sans min-h-screen">
  <nav class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 px-4 py-3">
    <div class="max-w-3xl mx-auto flex items-center justify-between">
      <a href="/index.html" class="font-bold text-accent">← Feed</a>
      <h1 class="font-bold">Reels</h1>
      <a href="/mini-fb/search.html" class="text-sm text-gray-600 dark:text-gray-300">Search</a>
    </div>
  </nav>

  <main class="max-w-3xl mx-auto p-4">
    <div class="mb-3 flex items-center justify-between">
      <p class="text-sm text-gray-500">Swipe/scroll to move through reels.</p>
      <button id="toggleReelSound" type="button" class="px-3 py-1.5 rounded-xl border border-gray-200 dark:border-gray-600 text-sm">🔇 Muted</button>
    </div>
    <div id="reelsFeed" class="space-y-5 snap-y snap-mandatory"></div>
  </main>

  <script type="module">
    import { initFirebase } from "./src/firebase-config.js";
    import { requireAuth, bootPage } from "./src/page-boot.js";
    import { startReelsPage } from "./src/reels.js";

    const firebase = initFirebase();
    const user = await requireAuth(firebase);
    if (!user) throw new Error("auth");
    bootPage(firebase);

    const db = firebase.__db;
    startReelsPage(db, document.getElementById("reelsFeed"));

    let muted = true;
    const btn = document.getElementById("toggleReelSound");
    btn?.addEventListener("click", () => {
      muted = !muted;
      btn.textContent = muted ? "🔇 Muted" : "🔊 Sound on";
      document.querySelectorAll("video[data-reel-video='1']").forEach((v) => {
        v.muted = muted;
      });
    });
  </script>
</body>
</html>
