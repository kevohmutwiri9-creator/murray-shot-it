<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SnapVerse • Hashtag</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="murray.png" type="image/png" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#1a1a2e',
            secondary: '#16213e',
            accent: '#e94560',
            light: '#f8f9fa',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        },
      },
    }
  </script>
</head>

<body class="bg-light dark:bg-gray-900 text-gray-900 dark:text-gray-100 font-sans">
  <!-- Header -->
  <nav class="bg-white/90 dark:bg-gray-800/90 backdrop-blur-md border-b border-gray-200 dark:border-gray-700">
    <div class="max-w-6xl mx-auto px-3 sm:px-4 lg:px-8">
      <div class="flex items-center justify-between h-14 sm:h-16">
        <a href="/index.html" class="flex items-center space-x-2">
          <img src="murray.png" alt="SnapVerse" class="w-7 h-7 sm:w-8 sm:h-8"/>
          <span class="text-lg sm:text-xl font-bold text-transparent bg-gradient-to-r from-accent to-purple-600 bg-clip-text">SnapVerse</span>
        </a>

        <div class="flex items-center gap-2 sm:gap-3">
          <button id="darkModeToggle" class="p-2 rounded-xl border border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-700 transition">
            <svg id="moonIcon" class="h-5 w-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
            </svg>
            <svg id="sunIcon" class="h-5 w-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12 a4 4 0 11-8 0 4 4 0 018 0z"/>
            </svg>
          </button>
          <div class="hidden sm:flex sm:items-center sm:gap-3">
            <a href="/index.html" class="text-gray-700 dark:text-gray-300 hover:text-accent font-medium text-sm">Feed</a>
            <a href="settings.html" class="text-gray-700 dark:text-gray-300 hover:text-accent font-medium text-sm">Settings</a>
          </div>
          <button id="mobileMenuBtn" class="sm:hidden p-2 rounded-xl border border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-700 transition">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Mobile Menu -->
  <div id="mobileMenu" class="fixed inset-0 bg-black/50 z-50 hidden sm:hidden">
    <div class="absolute right-0 top-0 h-full w-64 bg-white dark:bg-gray-800 shadow-xl">
      <div class="p-4 border-b border-gray-200 dark:border-gray-700">
        <button id="closeMobileMenu" class="p-2 rounded-xl border border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-700 transition">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="p-4 space-y-2">
        <a href="/index.html" class="block px-4 py-3 rounded-xl text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 font-medium">Feed</a>
        <a href="settings.html" class="block px-4 py-3 rounded-xl text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 font-medium">Settings</a>
      </div>
    </div>
  </div>

  <!-- Main -->
  <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
    <div class="mb-8">
      <h1 id="hashtagTitle" class="text-3xl font-bold text-gray-900 dark:text-white">#hashtag</h1>
      <p id="hashtagCount" class="text-gray-500 dark:text-gray-400 mt-1">Loading posts...</p>
    </div>

    <div id="hashtagPosts" class="space-y-4">
      <!-- Posts render here -->
    </div>

    <div id="noPosts" class="text-center text-gray-500 dark:text-gray-400 py-12 hidden">
      No posts with this hashtag yet.
    </div>
  </main>

  <script type="module">
    import { initFirebase } from "./src/firebase-config.js";
    import { ensureAuth, getCurrentUser } from "./src/auth.js";
    import { collection, query, orderBy, onSnapshot, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebase = initFirebase();
    await ensureAuth(firebase);

    const user = getCurrentUser();
    const db = firebase.__db;

    // Get hashtag from URL
    const urlParams = new URLSearchParams(window.location.search);
    const hashtag = urlParams.get("tag")?.toLowerCase();

    if (!hashtag) {
      window.location.href = "/index.html";
    }

    document.getElementById("hashtagTitle").textContent = `#${hashtag}`;

    // Dark mode toggle
    const darkModeToggle = document.getElementById("darkModeToggle");
    const moonIcon = document.getElementById("moonIcon");
    const sunIcon = document.getElementById("sunIcon");

    if (localStorage.getItem("darkMode") === "true" ||
        (!localStorage.getItem("darkMode") && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
      document.documentElement.classList.add("dark");
    }

    darkModeToggle.addEventListener("click", () => {
      document.documentElement.classList.toggle("dark");
      const isDark = document.documentElement.classList.contains("dark");
      localStorage.setItem("darkMode", isDark);
    });

    // Mobile menu toggle
    const mobileMenuBtn = document.getElementById("mobileMenuBtn");
    const closeMobileMenu = document.getElementById("closeMobileMenu");
    const mobileMenu = document.getElementById("mobileMenu");

    mobileMenuBtn.addEventListener("click", () => {
      mobileMenu.classList.remove("hidden");
    });

    closeMobileMenu.addEventListener("click", () => {
      mobileMenu.classList.add("hidden");
    });

    mobileMenu.addEventListener("click", (e) => {
      if (e.target === mobileMenu) {
        mobileMenu.classList.add("hidden");
      }
    });

    // Load hashtag posts
    const loadHashtagPosts = async () => {
      const hashtagRef = doc(db, "hashtags", hashtag);
      const hashtagSnap = await getDoc(hashtagRef);

      if (!hashtagSnap.exists()) {
        document.getElementById("noPosts").classList.remove("hidden");
        document.getElementById("hashtagCount").textContent = "0 posts";
        return;
      }

      const hashtagData = hashtagSnap.data();
      const postIds = hashtagData.postIds || [];

      document.getElementById("hashtagCount").textContent = `${postIds.length} post${postIds.length === 1 ? "" : "s"}`;

      if (postIds.length === 0) {
        document.getElementById("noPosts").classList.remove("hidden");
        return;
      }

      // Load posts
      const posts = [];
      for (const postId of postIds) {
        const postRef = doc(db, "posts", postId);
        const postSnap = await getDoc(postRef);
        if (postSnap.exists()) {
          posts.push({ id: postSnap.id, ...postSnap.data() });
        }
      }

      // Sort by date
      posts.sort((a, b) => {
        const aTime = a.createdAt?.toDate?.() || new Date(0);
        const bTime = b.createdAt?.toDate?.() || new Date(0);
        return bTime - aTime;
      });

      const container = document.getElementById("hashtagPosts");
      container.innerHTML = "";

      posts.forEach((post) => {
        const card = document.createElement("article");
        card.className = "overflow-hidden rounded-3xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 shadow-sm";
        card.innerHTML = `
          <div class="p-5 border-b border-gray-100 dark:border-gray-700">
            <div class="flex justify-between items-start">
              <div>
                <h3 class="text-lg font-bold text-gray-900 dark:text-white">${post.title || "Untitled"}</h3>
                <p class="text-sm text-gray-500 dark:text-gray-400">${post.authorEmail || "Unknown"}</p>
              </div>
              <span class="text-xs text-gray-500 dark:text-gray-400">${post.createdAt?.toDate?.() ? post.createdAt.toDate().toLocaleDateString() : "Just now"}</span>
            </div>
          </div>
          <div class="p-5">
            <p class="text-gray-700 dark:text-gray-300">${post.text || ""}</p>
            ${post.mediaUrl ? `<img src="${post.mediaUrl}" alt="Post media" class="mt-3 rounded-xl max-h-64 object-cover w-full" />` : ""}
          </div>
        `;
        container.appendChild(card);
      });
    };

    loadHashtagPosts();
  </script>
</body>
</html>
