<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.tailwindcss.com; font-src 'self' https://fonts.gstatic.com https://fonts.googleapis.com; img-src 'self' data: https:; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://*.gstatic.com https://api.imgbb.com;">
  <title>SnapVerse • Hashtag</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com" async="false"></script>
  <link rel="icon" href="murray.png" type="image/png" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#1a1a2e',
            secondary: '#16213e',
            accent: '#e94560',
            accentHover: '#d63d55',
            accentLight: '#f06b82',
            light: '#f8f9fa',
            dark: {
              bg: '#0f172a',
              surface: '#1e293b',
              border: '#334155',
              text: '#f1f5f9',
              muted: '#94a3b8',
            },
            gradient: {
              from: '#e94560',
              to: '#8b5cf6',
            },
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          fontSize: {
            'xs': ['0.75rem', { lineHeight: '1rem' }],
            'sm': ['0.875rem', { lineHeight: '1.25rem' }],
            'base': ['1rem', { lineHeight: '1.5rem' }],
            'lg': ['1.125rem', { lineHeight: '1.75rem' }],
            'xl': ['1.25rem', { lineHeight: '1.75rem' }],
            '2xl': ['1.5rem', { lineHeight: '2rem' }],
            '3xl': ['1.875rem', { lineHeight: '2.25rem' }],
          },
          letterSpacing: {
            'tight': '-0.025em',
            'normal': '0',
            'wide': '0.025em',
          },
          animation: {
            'fade-in': 'fadeIn 0.3s ease-in-out',
            'slide-up': 'slideUp 0.3s ease-out',
            'slide-down': 'slideDown 0.3s ease-out',
            'scale-in': 'scaleIn 0.2s ease-out',
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'gradient-x': 'gradientX 3s ease infinite',
            'float': 'float 3s ease-in-out infinite',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { transform: 'translateY(10px)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' },
            },
            slideDown: {
              '0%': { transform: 'translateY(-10px)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' },
            },
            scaleIn: {
              '0%': { transform: 'scale(0.95)', opacity: '0' },
              '100%': { transform: 'scale(1)', opacity: '1' },
            },
            gradientX: {
              '0%, 100%': {
                'background-size': '200% 200%',
                'background-position': 'left center'
              },
              '50%': {
                'background-size': '200% 200%',
                'background-position': 'right center'
              },
            },
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-5px)' },
            },
          },
          backgroundImage: {
            'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
            'gradient-conic': 'conic-gradient(from 180deg at 50% 50%, var(--tw-gradient-stops))',
          },
          boxShadow: {
            'soft': '0 2px 8px rgba(0, 0, 0, 0.08)',
            'medium': '0 4px 16px rgba(0, 0, 0, 0.12)',
            'strong': '0 8px 32px rgba(0, 0, 0, 0.16)',
            'glow': '0 0 20px rgba(233, 69, 96, 0.3)',
            'glow-purple': '0 0 20px rgba(139, 92, 246, 0.3)',
          },
        },
      },
    }
  </script>
</head>

<body class="bg-light dark:bg-dark-bg text-gray-900 dark:text-dark-text font-sans">
  <!-- Header -->
  <nav class="bg-white/80 dark:bg-dark-surface/80 backdrop-blur-lg border-b border-gray-200/50 dark:border-dark-border/50 sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-3 sm:px-4 lg:px-8">
      <div class="flex items-center justify-between h-14 sm:h-16">
        <a href="/index.html" class="flex items-center space-x-2 group">
          <img src="murray.png" alt="SnapVerse" class="w-7 h-7 sm:w-8 sm:h-8 transition-transform group-hover:scale-110"/>
          <span class="text-lg sm:text-xl font-bold text-transparent bg-gradient-to-r from-accent to-purple-600 bg-clip-text bg-gradient-x animate-gradient-x">SnapVerse</span>
        </a>

        <div class="flex items-center gap-2 sm:gap-3">
          <button id="darkModeToggle" class="p-2 rounded-xl border border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-700 hover:scale-105 active:scale-95 transition-all duration-200" aria-label="Toggle dark mode">
            <svg id="moonIcon" class="h-5 w-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
            </svg>
            <svg id="sunIcon" class="h-5 w-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12 a4 4 0 11-8 0 4 4 0 018 0z"/>
            </svg>
          </button>
          <div class="hidden sm:flex sm:items-center sm:gap-3">
            <a href="/index.html" class="text-gray-700 dark:text-gray-300 hover:text-accent font-medium text-sm">Feed</a>
            <a href="settings.html" class="text-gray-700 dark:text-gray-300 hover:text-accent font-medium text-sm">Settings</a>
          </div>
          <button id="mobileMenuBtn" class="sm:hidden p-2 rounded-xl border border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-700 hover:scale-105 active:scale-95 transition-all duration-200" aria-label="Open menu" aria-expanded="false" aria-controls="mobileMenu">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Mobile Menu -->
  <div id="mobileMenu" class="fixed inset-0 bg-black/50 z-50 hidden sm:hidden">
    <div class="absolute right-0 top-0 h-full w-64 bg-white/80 dark:bg-dark-surface/80 backdrop-blur-lg shadow-medium">
      <div class="p-4 border-b border-gray-200/50 dark:border-dark-border/50">
        <button id="closeMobileMenu" class="p-2 rounded-xl border border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-700 hover:scale-105 active:scale-95 transition-all duration-200" aria-label="Close menu">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="p-4 space-y-2">
        <a href="/index.html" class="block px-4 py-3 rounded-xl text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 font-medium">Feed</a>
        <a href="settings.html" class="block px-4 py-3 rounded-xl text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 font-medium">Settings</a>
      </div>
    </div>
  </div>

  <!-- Main -->
  <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 animate-fade-in">
    <div class="mb-8 animate-slide-up">
      <h1 id="hashtagTitle" class="text-3xl font-bold text-gray-900 dark:text-dark-text">#hashtag</h1>
      <p id="hashtagCount" class="text-gray-500 dark:text-dark-muted mt-1">Loading posts...</p>
    </div>

    <div id="hashtagPosts" class="space-y-4">
      <div class="bg-white dark:bg-dark-surface rounded-2xl p-4 shadow-soft">
        <div class="flex gap-3 mb-3">
          <div class="w-10 h-10 rounded-full bg-gray-200 dark:bg-gray-700 animate-pulse"></div>
          <div class="flex-1 space-y-2">
            <div class="h-4 bg-gray-200 dark:bg-gray-700 rounded animate-pulse w-1/3"></div>
            <div class="h-3 bg-gray-200 dark:bg-gray-700 rounded animate-pulse w-1/4"></div>
          </div>
        </div>
        <div class="h-32 bg-gray-200 dark:bg-gray-700 rounded-lg animate-pulse"></div>
      </div>
      <div class="bg-white dark:bg-dark-surface rounded-2xl p-4 shadow-soft">
        <div class="flex gap-3 mb-3">
          <div class="w-10 h-10 rounded-full bg-gray-200 dark:bg-gray-700 animate-pulse"></div>
          <div class="flex-1 space-y-2">
            <div class="h-4 bg-gray-200 dark:bg-gray-700 rounded animate-pulse w-1/3"></div>
            <div class="h-3 bg-gray-200 dark:bg-gray-700 rounded animate-pulse w-1/4"></div>
          </div>
        </div>
        <div class="h-32 bg-gray-200 dark:bg-gray-700 rounded-lg animate-pulse"></div>
      </div>
    </div>

    <div id="noPosts" class="text-center text-gray-500 dark:text-dark-muted py-12 hidden">
      No posts with this hashtag yet.
    </div>
  </main>

  <script type="module">
    import { initFirebase } from "./src/firebase-config.js";
    import { ensureAuth, getCurrentUser } from "./src/auth.js";
    import { collection, query, orderBy, onSnapshot, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebase = initFirebase();
    await ensureAuth(firebase);

    const user = getCurrentUser();
    const db = firebase.__db;

    // Get hashtag from URL
    const urlParams = new URLSearchParams(window.location.search);
    const hashtag = urlParams.get("tag")?.toLowerCase();

    if (!hashtag) {
      window.location.href = "/index.html";
    }

    document.getElementById("hashtagTitle").textContent = `#${hashtag}`;

    // Dark mode toggle
    const darkModeToggle = document.getElementById("darkModeToggle");
    const moonIcon = document.getElementById("moonIcon");
    const sunIcon = document.getElementById("sunIcon");

    if (localStorage.getItem("darkMode") === "true" ||
        (!localStorage.getItem("darkMode") && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
      document.documentElement.classList.add("dark");
    }

    darkModeToggle.addEventListener("click", () => {
      document.documentElement.classList.toggle("dark");
      const isDark = document.documentElement.classList.contains("dark");
      localStorage.setItem("darkMode", isDark);
    });

    // Mobile menu toggle
    const mobileMenuBtn = document.getElementById("mobileMenuBtn");
    const closeMobileMenu = document.getElementById("closeMobileMenu");
    const mobileMenu = document.getElementById("mobileMenu");

    mobileMenuBtn.addEventListener("click", () => {
      mobileMenu.classList.remove("hidden");
    });

    closeMobileMenu.addEventListener("click", () => {
      mobileMenu.classList.add("hidden");
    });

    mobileMenu.addEventListener("click", (e) => {
      if (e.target === mobileMenu) {
        mobileMenu.classList.add("hidden");
      }
    });

    // Load hashtag posts
    const loadHashtagPosts = async () => {
      const hashtagRef = doc(db, "hashtags", hashtag);
      const hashtagSnap = await getDoc(hashtagRef);

      if (!hashtagSnap.exists()) {
        document.getElementById("noPosts").classList.remove("hidden");
        document.getElementById("hashtagCount").textContent = "0 posts";
        return;
      }

      const hashtagData = hashtagSnap.data();
      const postIds = hashtagData.postIds || [];

      document.getElementById("hashtagCount").textContent = `${postIds.length} post${postIds.length === 1 ? "" : "s"}`;

      if (postIds.length === 0) {
        document.getElementById("noPosts").classList.remove("hidden");
        return;
      }

      // Load posts
      const posts = [];
      for (const postId of postIds) {
        const postRef = doc(db, "posts", postId);
        const postSnap = await getDoc(postRef);
        if (postSnap.exists()) {
          posts.push({ id: postSnap.id, ...postSnap.data() });
        }
      }

      // Sort by date
      posts.sort((a, b) => {
        const aTime = a.createdAt?.toDate?.() || new Date(0);
        const bTime = b.createdAt?.toDate?.() || new Date(0);
        return bTime - aTime;
      });

      const container = document.getElementById("hashtagPosts");
      container.innerHTML = "";

      posts.forEach((post) => {
        const card = document.createElement("article");
        card.className = "overflow-hidden rounded-3xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 shadow-sm";
        card.innerHTML = `
          <div class="p-5 border-b border-gray-100 dark:border-gray-700">
            <div class="flex justify-between items-start">
              <div>
                <h3 class="text-lg font-bold text-gray-900 dark:text-white">${post.title || "Untitled"}</h3>
                <p class="text-sm text-gray-500 dark:text-gray-400">${post.authorEmail || "Unknown"}</p>
              </div>
              <span class="text-xs text-gray-500 dark:text-gray-400">${post.createdAt?.toDate?.() ? post.createdAt.toDate().toLocaleDateString() : "Just now"}</span>
            </div>
          </div>
          <div class="p-5">
            <p class="text-gray-700 dark:text-gray-300">${post.text || ""}</p>
            ${post.mediaUrl ? `<img src="${post.mediaUrl}" alt="Post media" class="mt-3 rounded-xl max-h-64 object-cover w-full" />` : ""}
          </div>
        `;
        container.appendChild(card);
      });
    };

    loadHashtagPosts();
  </script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(registration => {
            console.log('Service Worker registered with scope:', registration.scope);
          })
          .catch(error => {
            console.log('Service Worker registration failed:', error);
          });
      });
    }
  </script>
</body>
</html>
