<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.tailwindcss.com; font-src 'self' https://fonts.gstatic.com https://fonts.googleapis.com; img-src 'self' data: https:; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://*.gstatic.com https://api.imgbb.com;">
  <title>SnapVerse • Search</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com" async="false"></script>
  <link rel="icon" href="murray.png" type="image/png" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#1a1a2e',
            secondary: '#16213e',
            accent: '#e94560',
            accentHover: '#d63d55',
            accentLight: '#f06b82',
            light: '#f8f9fa',
            dark: {
              bg: '#0f172a',
              surface: '#1e293b',
              border: '#334155',
              text: '#f1f5f9',
              muted: '#94a3b8',
            },
            gradient: {
              from: '#e94560',
              to: '#8b5cf6',
            },
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          fontSize: {
            'xs': ['0.75rem', { lineHeight: '1rem' }],
            'sm': ['0.875rem', { lineHeight: '1.25rem' }],
            'base': ['1rem', { lineHeight: '1.5rem' }],
            'lg': ['1.125rem', { lineHeight: '1.75rem' }],
            'xl': ['1.25rem', { lineHeight: '1.75rem' }],
            '2xl': ['1.5rem', { lineHeight: '2rem' }],
            '3xl': ['1.875rem', { lineHeight: '2.25rem' }],
          },
          letterSpacing: {
            'tight': '-0.025em',
            'normal': '0',
            'wide': '0.025em',
          },
          animation: {
            'fade-in': 'fadeIn 0.3s ease-in-out',
            'slide-up': 'slideUp 0.3s ease-out',
            'slide-down': 'slideDown 0.3s ease-out',
            'scale-in': 'scaleIn 0.2s ease-out',
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'gradient-x': 'gradientX 3s ease infinite',
            'float': 'float 3s ease-in-out infinite',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { transform: 'translateY(10px)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' },
            },
            slideDown: {
              '0%': { transform: 'translateY(-10px)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' },
            },
            scaleIn: {
              '0%': { transform: 'scale(0.95)', opacity: '0' },
              '100%': { transform: 'scale(1)', opacity: '1' },
            },
            gradientX: {
              '0%, 100%': {
                'background-size': '200% 200%',
                'background-position': 'left center'
              },
              '50%': {
                'background-size': '200% 200%',
                'background-position': 'right center'
              },
            },
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-5px)' },
            },
          },
          backgroundImage: {
            'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
            'gradient-conic': 'conic-gradient(from 180deg at 50% 50%, var(--tw-gradient-stops))',
          },
          boxShadow: {
            'soft': '0 2px 8px rgba(0, 0, 0, 0.08)',
            'medium': '0 4px 16px rgba(0, 0, 0, 0.12)',
            'strong': '0 8px 32px rgba(0, 0, 0, 0.16)',
            'glow': '0 0 20px rgba(233, 69, 96, 0.3)',
            'glow-purple': '0 0 20px rgba(139, 92, 246, 0.3)',
          },
        },
      },
    }
  </script>
</head>

<body class="bg-light dark:bg-dark-bg text-gray-900 dark:text-dark-text font-sans">
  <!-- Header -->
  <nav class="bg-white/80 dark:bg-dark-surface/80 backdrop-blur-lg border-b border-gray-200/50 dark:border-dark-border/50 sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-3 sm:px-4 lg:px-8">
      <div class="flex items-center justify-between h-14 sm:h-16">
        <a href="/index.html" class="flex items-center space-x-2 group">
          <img src="murray.png" alt="SnapVerse" class="w-7 h-7 sm:w-8 sm:h-8 transition-transform group-hover:scale-110"/>
          <span class="text-lg sm:text-xl font-bold text-transparent bg-gradient-to-r from-accent to-purple-600 bg-clip-text bg-gradient-x animate-gradient-x">SnapVerse</span>
        </a>

        <div class="flex items-center gap-2 sm:gap-3">
          <button id="darkModeToggle" class="p-2 rounded-xl border border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-700 hover:scale-105 active:scale-95 transition-all duration-200" aria-label="Toggle dark mode">
            <svg id="moonIcon" class="h-5 w-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
            </svg>
            <svg id="sunIcon" class="h-5 w-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12 a4 4 0 11-8 0 4 4 0 018 0z"/>
            </svg>
          </button>
          <div class="hidden sm:flex sm:items-center sm:gap-3">
            <a href="/index.html" class="text-gray-700 dark:text-gray-300 hover:text-accent font-medium text-sm">Feed</a>
            <a href="settings.html" class="text-gray-700 dark:text-gray-300 hover:text-accent font-medium text-sm">Settings</a>
          </div>
          <button id="mobileMenuBtn" class="sm:hidden p-2 rounded-xl border border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-700 hover:scale-105 active:scale-95 transition-all duration-200" aria-label="Open menu" aria-expanded="false" aria-controls="mobileMenu">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Mobile Menu -->
  <div id="mobileMenu" class="fixed inset-0 bg-black/50 z-50 hidden sm:hidden">
    <div class="absolute right-0 top-0 h-full w-64 bg-white/80 dark:bg-dark-surface/80 backdrop-blur-lg shadow-medium">
      <div class="p-4 border-b border-gray-200/50 dark:border-dark-border/50">
        <button id="closeMobileMenu" class="p-2 rounded-xl border border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-700 hover:scale-105 active:scale-95 transition-all duration-200" aria-label="Close menu">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="p-4 space-y-2">
        <a href="/index.html" class="block px-4 py-3 rounded-xl text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 font-medium">Feed</a>
        <a href="settings.html" class="block px-4 py-3 rounded-xl text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 font-medium">Settings</a>
      </div>
    </div>
  </div>

  <!-- Main -->
  <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 animate-fade-in">
    <!-- Search Bar -->
    <section class="mb-8 animate-slide-up">
      <div class="bg-white/80 dark:bg-dark-surface/80 backdrop-blur-lg rounded-2xl shadow-soft border border-gray-200/50 dark:border-dark-border/50 p-4">
        <input
          id="searchInput"
          type="text"
          placeholder="Search for users, posts, or hashtags..."
          class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-dark-bg text-gray-900 dark:text-dark-text outline-none focus:ring-2 focus:ring-accent/50 focus:border-accent transition-all"
        />
        <div class="mt-3 flex gap-2">
          <button id="searchUsersBtn" class="px-4 py-2 rounded-xl bg-gradient-to-r from-accent to-purple-600 text-white font-semibold hover:from-accentHover hover:to-purple-700 transition-all duration-200 transform hover:scale-105 active:scale-95 shadow-glow">Users</button>
          <button id="searchPostsBtn" class="px-4 py-2 rounded-xl border border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-700 hover:scale-105 active:scale-95 transition-all duration-200">Posts</button>
          <button id="searchHashtagsBtn" class="px-4 py-2 rounded-xl border border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-700 hover:scale-105 active:scale-95 transition-all duration-200">Hashtags</button>
        </div>
      </div>
    </section>

    <!-- Search Results -->
    <section class="animate-slide-up">
      <h2 id="resultsTitle" class="text-2xl font-bold text-gray-900 dark:text-dark-text mb-4">Search Results</h2>
      <div id="searchResults" class="space-y-4">
        <div class="text-center text-gray-500 dark:text-dark-muted py-12">Enter a search term above</div>
      </div>
    </section>
  </main>

  <script type="module">
    import { initFirebase } from "./src/firebase-config.js";
    import { getCurrentUser } from "./src/auth.js";
    import { requireAuth, bootPage } from "./src/page-boot.js";
    import { followUser, unfollowUser, isFollowing } from "./src/follows.js";
    import { isPostVisible } from "./src/scheduled-posts.js";
    import { showToast } from "./src/ui.js";
    import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebase = initFirebase();
    const user = await requireAuth(firebase);
    if (!user) throw new Error("Not signed in");

    const db = firebase.__db;
    bootPage(firebase);

    const RECENT_KEY = "sv_recent_searches";
    function loadRecent() {
      try {
        return JSON.parse(localStorage.getItem(RECENT_KEY) || "[]");
      } catch {
        return [];
      }
    }
    function saveRecent(term) {
      const list = [term, ...loadRecent().filter((t) => t !== term)].slice(0, 8);
      localStorage.setItem(RECENT_KEY, JSON.stringify(list));
    }

    const searchInput = document.getElementById("searchInput");
    const searchResults = document.getElementById("searchResults");
    const resultsTitle = document.getElementById("resultsTitle");
    let currentSearchType = "users";

    function showRecentSearches() {
      const recent = loadRecent();
      if (!recent.length) return;
      resultsTitle.textContent = "Recent searches";
      searchResults.innerHTML = recent
        .map(
          (t) =>
            `<button type="button" class="recent-term w-full text-left px-4 py-3 rounded-xl border border-gray-200 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-700" data-term="${t}">${t}</button>`
        )
        .join("");
      searchResults.querySelectorAll(".recent-term").forEach((btn) => {
        btn.addEventListener("click", () => {
          searchInput.value = btn.dataset.term;
          performSearch();
        });
      });
    }
    showRecentSearches();

    document.getElementById("searchUsersBtn").addEventListener("click", () => {
      currentSearchType = "users";
      updateButtonStyles();
      if (searchInput.value.trim()) performSearch();
    });

    document.getElementById("searchPostsBtn").addEventListener("click", () => {
      currentSearchType = "posts";
      updateButtonStyles();
      if (searchInput.value.trim()) performSearch();
    });

    document.getElementById("searchHashtagsBtn").addEventListener("click", () => {
      currentSearchType = "hashtags";
      updateButtonStyles();
      if (searchInput.value.trim()) performSearch();
    });

    function updateButtonStyles() {
      const usersBtn = document.getElementById("searchUsersBtn");
      const postsBtn = document.getElementById("searchPostsBtn");
      const hashtagsBtn = document.getElementById("searchHashtagsBtn");

      usersBtn.className = currentSearchType === "users" 
        ? "px-4 py-2 rounded-xl bg-accent text-white font-semibold hover:bg-accent/90 transition"
        : "px-4 py-2 rounded-xl border border-gray-200 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-700 transition";
      
      postsBtn.className = currentSearchType === "posts"
        ? "px-4 py-2 rounded-xl bg-accent text-white font-semibold hover:bg-accent/90 transition"
        : "px-4 py-2 rounded-xl border border-gray-200 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-700 transition";
      
      hashtagsBtn.className = currentSearchType === "hashtags"
        ? "px-4 py-2 rounded-xl bg-accent text-white font-semibold hover:bg-accent/90 transition"
        : "px-4 py-2 rounded-xl border border-gray-200 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-700 transition";
    }

    searchInput.addEventListener("input", () => {
      if (searchInput.value.trim()) {
        performSearch();
      } else {
        searchResults.innerHTML = '<div class="text-center text-gray-500 dark:text-gray-400 py-12">Enter a search term above</div>';
      }
    });

    async function performSearch() {
      const query = searchInput.value.trim().toLowerCase();
      if (!query) {
        showRecentSearches();
        return;
      }
      saveRecent(query);

      searchResults.innerHTML = '<div class="text-center text-gray-500 dark:text-gray-400 py-12">Searching...</div>';

      try {
        if (currentSearchType === "users") {
          await searchUsers(query);
        } else if (currentSearchType === "posts") {
          await searchPosts(query);
        } else if (currentSearchType === "hashtags") {
          await searchHashtags(query);
        }
      } catch (error) {
        searchResults.innerHTML = `<div class="text-center text-rose-600 dark:text-rose-400 py-12">Error: ${error.message}</div>`;
      }
    }

    async function searchUsers(query) {
      resultsTitle.textContent = "Users";
      const profilesCol = collection(db, "profiles");
      const snapshot = await getDocs(profilesCol);

      const results = [];
      snapshot.forEach((docSnap) => {
        const profile = docSnap.data();
        const displayName = (profile.displayName || "").toLowerCase();
        const email = (profile.email || "").toLowerCase();
        if (displayName.includes(query) || email.includes(query)) {
          results.push({ id: docSnap.id, ...profile });
        }
      });

      displayUserResults(results);
    }

    async function searchPosts(query) {
      resultsTitle.textContent = "Posts";
      const postsCol = collection(db, "posts");
      const snapshot = await getDocs(postsCol);

      const results = [];
      snapshot.forEach((docSnap) => {
        const post = docSnap.data();
        const title = (post.title || "").toLowerCase();
        const text = (post.text || "").toLowerCase();
        if ((title.includes(query) || text.includes(query)) && isPostVisible(post)) {
          results.push({ id: docSnap.id, ...post });
        }
      });

      displayPostResults(results);
    }

    async function searchHashtags(query) {
      resultsTitle.textContent = "Hashtags";
      const hashtagsCol = collection(db, "hashtags");
      const snapshot = await getDocs(hashtagsCol);

      const results = [];
      snapshot.forEach((docSnap) => {
        const tag = docSnap.id.toLowerCase();
        if (tag.includes(query)) {
          results.push({ id: docSnap.id, ...docSnap.data() });
        }
      });

      displayHashtagResults(results);
    }

    async function displayUserResults(results) {
      if (results.length === 0) {
        searchResults.innerHTML = '<div class="text-center text-gray-500 dark:text-gray-400 py-12">No users found</div>';
        return;
      }

      searchResults.innerHTML = "";
      for (const profile of results) {
        if (profile.id === user?.uid) continue;

        const card = document.createElement("div");
        card.className = "bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 p-4 flex items-center gap-4 flex-wrap";

        const following = user ? await isFollowing(db, user.uid, profile.id) : false;

        card.innerHTML = `
          <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-primary to-secondary text-white text-xl font-bold flex items-center justify-center">
            ${(profile.displayName || profile.email || "U").charAt(0).toUpperCase()}
          </div>
          <div class="flex-1 min-w-[140px]">
            <h3 class="font-bold text-gray-900 dark:text-white">${profile.displayName || profile.email}</h3>
            <p class="text-sm text-gray-500 dark:text-gray-400">${profile.email || ""}</p>
            ${profile.bio ? `<p class="text-sm text-gray-600 dark:text-gray-400 mt-1">${profile.bio}</p>` : ""}
          </div>
          <div class="flex gap-2">
            <button type="button" class="follow-btn px-4 py-2 rounded-xl font-semibold transition ${following ? "border border-gray-200 dark:border-gray-600" : "bg-accent text-white hover:bg-accent/90"}">${following ? "Following" : "Follow"}</button>
            <a href="/mini-fb/profile.html?uid=${profile.id}" class="px-4 py-2 rounded-xl border border-gray-200 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-700 transition">View</a>
          </div>
        `;

        const followBtn = card.querySelector(".follow-btn");
        followBtn.addEventListener("click", async () => {
          if (!user) return;
          try {
            if (following) {
              await unfollowUser(db, user.uid, profile.id);
              showToast("Unfollowed.", "info");
            } else {
              await followUser(db, user.uid, profile.id, firebase);
              showToast("Following!", "success");
            }
            await performSearch();
          } catch (err) {
            showToast(err.message || "Could not update follow.", "error");
          }
        });

        searchResults.appendChild(card);
      }
    }

    function displayPostResults(results) {
      if (results.length === 0) {
        searchResults.innerHTML = '<div class="text-center text-gray-500 dark:text-gray-400 py-12">No posts found</div>';
        return;
      }

      searchResults.innerHTML = "";
      results.forEach((post) => {
        const card = document.createElement("div");
        card.className = "bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 p-4";
        card.innerHTML = `
          <h3 class="font-bold text-gray-900 dark:text-white">${post.title || "Untitled"}</h3>
          <p class="text-gray-700 dark:text-gray-300 mt-1">${post.text || ""}</p>
          <p class="text-xs text-gray-500 dark:text-gray-400 mt-2">By ${post.authorEmail || "Unknown"}</p>
          <a href="/index.html?post=${post.id}" class="inline-block mt-3 text-sm font-semibold text-accent hover:underline">Open in feed</a>
        `;
        searchResults.appendChild(card);
      });
    }

    function displayHashtagResults(results) {
      if (results.length === 0) {
        searchResults.innerHTML = '<div class="text-center text-gray-500 dark:text-gray-400 py-12">No hashtags found</div>';
        return;
      }

      searchResults.innerHTML = "";
      results.forEach((hashtag) => {
        const card = document.createElement("div");
        card.className = "bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 p-4 flex items-center justify-between";
        card.innerHTML = `
          <div>
            <h3 class="font-bold text-gray-900 dark:text-white">#${hashtag.id}</h3>
            <p class="text-sm text-gray-500 dark:text-gray-400">${hashtag.count || 0} posts</p>
          </div>
          <a href="hashtag.html?tag=${hashtag.id}" class="px-4 py-2 rounded-xl border border-gray-200 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-700 transition">View</a>
        `;
        searchResults.appendChild(card);
      });
    }
  </script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(registration => {
            console.log('Service Worker registered with scope:', registration.scope);
          })
          .catch(error => {
            console.log('Service Worker registration failed:', error);
          });
      });
    }
  </script>
</body>
</html>
