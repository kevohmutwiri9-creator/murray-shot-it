<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SnapVerse • Explore</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="../murray.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../murray.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../murray.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            accent: '#e94560'
          }
        }
      }
    };
  </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 font-sans min-h-screen">
  <nav class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 px-4 py-3">
    <div class="max-w-4xl mx-auto flex items-center justify-between gap-2">
      <a href="/index.html" class="font-bold text-accent">← Feed</a>
      <h1 class="font-bold">Explore</h1>
      <div class="flex items-center gap-2">
        <button id="installBtn" class="hidden px-3 py-1.5 rounded-lg bg-accent text-white font-semibold text-xs hover:bg-accent/90 transition">
          Install App
        </button>
        <button type="button" id="darkModeToggle" class="p-2 rounded-lg border border-gray-200 dark:border-gray-600 text-sm">🌙</button>
      </div>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto p-4 space-y-6 pb-20 sm:pb-4">
    <section class="bg-white dark:bg-gray-800 rounded-2xl border border-gray-200 dark:border-gray-700 p-5">
      <h2 class="text-lg font-bold mb-3">Trending hashtags</h2>
      <div id="trending" class="flex flex-wrap gap-2"></div>
    </section>
    <section class="bg-white dark:bg-gray-800 rounded-2xl border border-gray-200 dark:border-gray-700 p-5">
      <h2 class="text-lg font-bold mb-3">People you may know</h2>
      <div id="suggestions" class="space-y-2"></div>
    </section>
    <section class="bg-white dark:bg-gray-800 rounded-2xl border border-gray-200 dark:border-gray-700 p-5">
      <h2 class="text-lg font-bold mb-3">Popular posts</h2>
      <div id="popularPosts" class="space-y-4"></div>
    </section>
  </main>

  <!-- Mobile Bottom Navigation -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 z-40 sm:hidden">
    <div class="flex items-center justify-around py-2">
      <a href="/index.html" class="flex flex-col items-center p-2 text-gray-500 dark:text-gray-400">
        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
        <span class="text-xs mt-1">Home</span>
      </a>
      <a href="explore.html" class="flex flex-col items-center p-2 text-accent">
        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <span class="text-xs mt-1">Explore</span>
      </a>
      <a href="messages.html" class="flex flex-col items-center p-2 text-gray-500 dark:text-gray-400 relative">
        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
        </svg>
        <span id="mobileMessagesBadge" class="hidden absolute -top-1 -right-1 h-4 w-4 rounded-full bg-accent text-white text-[9px] flex items-center justify-center">0</span>
        <span class="text-xs mt-1">Messages</span>
      </a>
      <a href="reels.html" class="flex flex-col items-center p-2 text-gray-500 dark:text-gray-400">
        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
        </svg>
        <span class="text-xs mt-1">Reels</span>
      </a>
      <a href="profile.html" class="flex flex-col items-center p-2 text-gray-500 dark:text-gray-400">
        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        </svg>
        <span class="text-xs mt-1">Profile</span>
      </a>
    </div>
  </nav>

  <script type="module">
    import { initFirebase } from "./src/firebase-config.js";
    import { requireAuth, bootPage } from "./src/page-boot.js";
    import { getFriendSuggestions } from "./src/friend-suggestions.js";
    import { profileUrl } from "./src/profiles-cache.js";
    import { renderPostCard } from "./src/post-card.js";
    import { isPostVisible } from "./src/scheduled-posts.js";
    import { filterBlockedPosts, getBlockedUids } from "./src/blocks.js";
    import { initDarkMode } from "./src/ui.js";
    import { collection, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebase = initFirebase();
    const user = await requireAuth(firebase);
    if (!user) throw new Error("auth");
    initDarkMode("darkModeToggle");
    bootPage(firebase);
    window.__firebaseApp = firebase;
    window.currentFirebaseUser = user;

    const db = firebase.__db;
    const blocked = await getBlockedUids(db, user.uid);

    const tagsEl = document.getElementById("trending");
    const tagSnap = await getDocs(collection(db, "hashtags"));
    const tags = [];
    tagSnap.forEach((d) => tags.push({ id: d.id, ...d.data() }));
    tags.sort((a, b) => (b.count || 0) - (a.count || 0));
    tags.slice(0, 15).forEach((t) => {
      const a = document.createElement("a");
      a.href = `hashtag.html?tag=${encodeURIComponent(t.id)}`;
      a.className = "px-3 py-1 rounded-full bg-accent/10 text-accent text-sm font-medium";
      a.textContent = `#${t.id}`;
      tagsEl.appendChild(a);
    });
    if (!tags.length) tagsEl.innerHTML = '<p class="text-sm text-gray-500">No hashtags yet.</p>';

    const sugEl = document.getElementById("suggestions");
    const suggestions = await getFriendSuggestions(db, user.uid, 10);
    suggestions.forEach((p) => {
      const a = document.createElement("a");
      a.href = profileUrl(p.uid);
      a.className = "block p-3 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-700 font-medium";
      a.textContent = p.displayName || p.email || "User";
      sugEl.appendChild(a);
    });
    if (!suggestions.length) sugEl.innerHTML = '<p class="text-sm text-gray-500">Follow more people for suggestions.</p>';

    const postsEl = document.getElementById("popularPosts");
    const q = query(collection(db, "posts"), orderBy("likeCount", "desc"), limit(20));
    let posts = [];
    try {
      const snap = await getDocs(q);
      snap.forEach((d) => {
        const p = { id: d.id, ...d.data() };
        if (isPostVisible(p)) posts.push(p);
      });
    } catch {
      const snap = await getDocs(query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(30)));
      snap.forEach((d) => {
        const p = { id: d.id, ...d.data() };
        if (isPostVisible(p)) posts.push(p);
      });
      posts.sort((a, b) => (b.likeCount || 0) - (a.likeCount || 0));
    }
    posts = filterBlockedPosts(posts, blocked).slice(0, 8);
    posts.forEach((p) => postsEl.appendChild(renderPostCard(p, db)));
    if (!posts.length) postsEl.innerHTML = '<p class="text-sm text-gray-500">No posts yet.</p>';
  </script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(registration => {
            console.log('Service Worker registered with scope:', registration.scope);
          })
          .catch(error => {
            console.log('Service Worker registration failed:', error);
          });
      });
    }
  </script>

  <!-- PWA Install Handler -->
  <script>
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    // Temporarily show button for testing
    installBtn.classList.remove('hidden');

    window.addEventListener('beforeinstallprompt', (e) => {
      console.log('beforeinstallprompt event fired!');
      e.preventDefault();
      deferredPrompt = e;
      installBtn.classList.remove('hidden');
    });

    installBtn.addEventListener('click', async () => {
      console.log('Install button clicked');
      if (!deferredPrompt) {
        console.log('No deferred prompt available');
        alert('The app cannot be installed right now. Make sure you are on HTTPS or localhost.');
        return;
      }

      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;

      if (outcome === 'accepted') {
        console.log('User accepted the install prompt');
      } else {
        console.log('User dismissed the install prompt');
      }

      deferredPrompt = null;
      installBtn.classList.add('hidden');
    });

    window.addEventListener('appinstalled', () => {
      installBtn.classList.add('hidden');
      console.log('PWA was installed');
    });
  </script>
</body>
</html>
